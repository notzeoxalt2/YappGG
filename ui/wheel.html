<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; connect-src 'none'"><title>YappGG sound wheel</title><link rel="stylesheet" href="wheel.css"><script defer src="wheel.js"></script></head>
<body><main><div class="filter"><button id="up" aria-label="Parent sound folder" hidden>&#8592;</button><button id="folder-previous" aria-label="Previous folder">&#8249;</button><select id="folder" aria-label="Wheel sound folder" hidden></select><button id="folder-picker" aria-label="Choose sound folder" aria-haspopup="listbox" aria-expanded="false">All</button><div id="folder-menu" class="folder-menu" role="listbox" aria-label="Sound folders" hidden></div><button id="folder-next" aria-label="Next folder">&#8250;</button></div><p id="group" hidden></p><section id="dial" aria-label="Sound selection wheel"><svg id="segments" viewBox="0 0 520 520" role="group" aria-label="Sounds"></svg><div class="hub"><button id="cancel" aria-label="Close sound wheel">&#215;</button><span id="selected-name">Choose a sound</span><small id="hub-help">Drag outward</small></div></section><nav><button id="previous" aria-label="Previous sounds">&#8592; Back</button><span id="page"></span><button id="next" aria-label="Next sounds">Next &#8594;</button></nav><p id="help">Drag toward a sound and release to play · Esc cancels</p><p id="empty" hidden>Import sounds in Soundboard to fill your wheel.</p></main></body></html>
