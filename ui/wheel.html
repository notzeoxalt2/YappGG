<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; connect-src 'none'"><title>YappGG sound wheel</title><link rel="stylesheet" href="wheel.css"><script defer src="wheel.js"></script></head>
<body><main><header><span>YAPPGG / SOUND WHEEL</span><button id="cancel" aria-label="Close sound wheel">×</button></header><div class="filter"><select id="folder" aria-label="Wheel sound folder"></select></div><section id="dial" aria-label="Sound selection wheel"><svg id="segments" viewBox="0 0 520 520" role="group" aria-label="Sounds"></svg><div class="hub"><span id="selected-name">Choose a sound</span><small id="hub-help">Drag outward</small></div></section><nav><button id="previous" aria-label="Previous sounds">‹</button><span id="page"></span><button id="next" aria-label="Next sounds">›</button></nav><p id="help">Drag toward a sound and release to play · Esc cancels</p><p id="empty" hidden>Import sounds in Soundboard to fill your wheel.</p></main></body></html>
