<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <meta http-equiv="Content-Type" content="text/html;charset=UTF-8">

    <!-- all styles -->
    <link rel="stylesheet" href="index.css">

    <title data-bind="localizedText: 'main.windowTitle'">SteelSeries GG - Device Configurations</title>
  <script defer src="deviceConfig.js"></script></head>

  <body id="DeviceConfig" class="deviceConfigWindow" data-bind="css: device.optimizedName, windowEvents: {'close': device.close}">
    <div id="Preload"></div>
    <div id="ContainerFlex">
      <div id="BloomBanner" class="topBanner blue" data-bind="css: { visible: device.isBloomLightingDevice() && device.isBluetoothConnected() }">
        <span href="javascript:void(0)" data-bind="localizedText: { key: 'deviceConfig.bloom.bluetoothConnected' }">
          Device is connected via bluetooth.  Please switch to wired or 2.4g connection to edit illumination.
        </span>
      </div>
      <div id="PrismSyncBanner" class="topBanner" data-bind="css: { visible: device.prismSyncControlled() && !device.audioVisualizerControlled()}">
        <span data-bind="localizedText: { key: 'deviceConfig.engineAppControlledWarning.message1', '#ENGINE_APP#': 'PrismSync' }"></span>
        <a href="javascript:void(0)" data-bind="click: device.disablePrismSyncDevice, localizedText: { key: 'deviceConfig.engineAppControlledWarning.message2', '#ENGINE_APP#': 'PrismSync' }"></a>
      </div>
      <div id="AudioVisualizerBanner" class="topBanner" data-bind="css: { visible: device.audioVisualizerControlled }">
        <span data-bind="localizedText: { key: 'deviceConfig.engineAppControlledWarning.message1', '#ENGINE_APP#': 'Audio Visualizer' }"></span>
        <a href="javascript:void(0)" data-bind="click: device.toggleAudioVisualizer, localizedText: { key: 'deviceConfig.engineAppControlledWarning.message2', '#ENGINE_APP#': 'Audio Visualizer' }"></a>
      </div>
      <div id="ImageSyncBanner" class="topBanner" data-bind="css: { visible: device.imageSyncControlled }">
        <span data-bind="localizedText: { key: 'deviceConfig.engineAppControlledWarning.message1', '#ENGINE_APP#': 'ImageSync' }"></span>
        <a href="javascript:void(0)" data-bind="click: device.toggleImageSync, localizedText: { key: 'deviceConfig.engineAppControlledWarning.message2', '#ENGINE_APP#': 'ImageSync' }"></a>
      </div>
      <div id="GameSenseOLEDBanner" class="topBanner" data-bind="css: { visible: device.gameSenseOLEDControlled }">
        <span data-bind="localizedText: 'deviceConfig.engineAppControlledWarning.message3'"></span>
        <t data-bind="text: device.gameSenseOLEDAppName"></t>
      </div>
      <div id="WindowsCPIBanner" class="topBanner" data-bind="css: { visible: device.showCPIBanner() }">
        <span data-bind="localizedText: 'main.windowsCPI.configWindowWarning'"></span>
        <a href="javascript:void(0)" data-bind="click: device.displayCPIFixer, localizedText: 'main.windowsCPI.clickToFixCPI'"></a>
      </div>
      <!--ko if: device.selectedConfig() && device.selectedConfig().configSyncDisabledData -->
      <div id="ConfigSyncDisabledBanner" class="topBanner blue" data-bind="css: { visible: device.selectedConfig().configSyncDisabledData.field() === 1 }">
        <span class="bold" data-bind="localizedText: 'widgets.disableConfigSync.bannerWarningOne' "></span>
        <span data-bind="localizedText: 'widgets.disableConfigSync.bannerWarningTwo' "></span>
      </div>
      <!-- /ko -->
      <div id="Container">
        <section>

          <!-- SIDE RAIL -->
          <div class="rail">
            <div class="railContent" data-bind="css: { dragonDrop: device.doingDragonDrop, hasOnboardConfigurations: device.hasOnboardConfigurations, isAdvancedOnboardProfiles: device.isAdvancedOnboardProfiles }">
              <!-- ko if: device.hasOnboardConfigurations -->
              <h4 class="railHeader">
                <span data-bind="localizedText: 'deviceConfig.onboardProfiles.railTitle'"></span>
                <a href="javascript:void(0)" class="tooltip" data-bind="tooltip: { topright: true, tooltipClass: 'topright' }, localizedTitle: { key: 'deviceConfig.onboardProfiles.tooltip', '#DEVICE_SPECIFIC_TOOLTIP#': device.onboardProfilesTooltip }"></a>
              </h4>
              <div class="content vertical skinny onboard">
                <ul class="railListing configs onboardProfiles" data-bind="foreach: { data: device.onboardConfigurations, afterRender: device.applyDraggableBindings }, visible: device.areOnboardConfigurationsLoaded">
                  <li class="config onboard" data-bind="css: { noDrag: readOnly || emptySlot, reserved: readOnly, dropping: $root.device.droppingSoftwareConfig() == $data, drophover: $root.device.draggingSoftwareConfigOverProfile() == $data, dragging: $root.device.draggingOnboardProfile() == $data }, tooltip: { hover: true, tooltipClass: 'onboardProfileTooltip' }, attr: { title: tooltip }">
                    <a class="itemName" href="javascript:void(0)" data-bind="text: name"></a>
                  </li>
                </ul>
                <h3 class="pluginDeviceText" data-bind="visible: !device.areOnboardConfigurationsLoaded(), localizedText: {key: 'deviceConfig.onboardProfiles.plugIn','#DEVICENAME#': device.fullName}"></h3>
              </div>
              <!-- /ko -->
              <!-- ko if: device.isAdvancedOnboardProfiles() && device.configsAdvancedOnboard().length != 0 -->
              <h4 class="railHeader">
                <span data-bind="localizedText: 'deviceConfig.onboardProfiles.railTitle'"></span>
              </h4>
              <div class="content sseConfigsContainer advancedOnboard vertical skinny">
                <ul class="railListing configs sseConfigs advancedOnboard" id="AdvancedOnboardConfigurationsList" data-bind="foreach: { data: device.configsAdvancedOnboard, afterRender: device.applyDraggableBindings }, contextmenu: {items: device.configMenuItems}">
                  <li class="config hasContextMenu" data-bind="css: {selected: selected(), dragging: $root.device.draggingSoftwareConfig() == $data, dropping: $root.device.droppingSoftwareConfig() == $data, drophover: $root.device.draggingSoftwareConfigOverProfile() == $data }, click: $root.device.selectConfigIfNoChanges">
                    <a class="itemName" href="javascript:void(0)" data-bind="text: name"></a>
                    <span class="icon cogIcon" data-bind="openContextmenu: {trigger: 'left'}"></span>
                    <!-- ko if: (!$root.device.ggLoadoutsEnabled() && (appsModel.applications().length > 0)) -->
                    <div class="applications" data-bind="foreach: appsModel.applications">
                      <!-- ko if: hasSpecialIconCss() -->
                      <div data-bind="attr: {class: specialIconCss}"></div>
                      <!-- /ko -->
                      <!-- ko if: !hasSpecialIconCss() -->
                      <img data-bind="attr: {src: imagePath}, css: {'default_app_icon': !hasImagePath()}">
                      <!-- /ko -->
                    </div>
                    <!-- /ko -->
                    <!-- ko if: $root.device.ggLoadoutsEnabled() -->
                    <div data-bind="configLoadoutIcons: { configID: id, deviceID: deviceId }"></div>
                    <!-- /ko -->
                  </li>
                </ul>
              </div>
              <!-- /ko -->
              <h4 class="railHeader">
                <span data-bind="localizedText: 'deviceConfig.railTitle'"></span>
                <a href="javascript:void(0)" class="tooltip" data-bind="tooltip: { right: true }, visible: device.hasOnboardConfigurations, localizedTitle: 'deviceConfig.railTooltip'"></a>
              </h4>
              <!-- ko ifnot: device.hasOnboardContent -->
              <div class="content sseConfigsContainer scrollableContainer vertical skinny" data-bind="css: { draggingTo: device.draggingOnboardProfile, dropping: device.droppingOnboardProfile, drophover: device.draggingOnboardProfileOverConfigs }">
                <ul class="railListing configs sseConfigs" id="ConfigurationsList" data-bind="foreach: { data: device.configsNormal, afterRender: device.applyDraggableBindings }, contextmenu: {items: device.configMenuItems}">
                  <li class="config hasContextMenu" data-bind="css: {selected: selected(), dragging: $root.device.draggingSoftwareConfig() == $data}, click: $root.device.selectConfigIfNoChanges">
                    <a class="itemName" href="javascript:void(0)" data-bind="text: name"></a>
                    <span class="icon cogIcon" data-bind="openContextmenu: {trigger: 'left'}"></span>
                    <!-- ko if: (!$root.device.ggLoadoutsEnabled() && (appsModel.applications().length > 0)) -->
                    <div class="applications" data-bind="foreach: appsModel.applications">
                      <!-- ko if: hasSpecialIconCss() -->
                      <div data-bind="attr: {class: specialIconCss}"></div>
                      <!-- /ko -->
                      <!-- ko if: !hasSpecialIconCss() -->
                      <img data-bind="attr: {src: imagePath}, css: {'default_app_icon': !hasImagePath()}">
                      <!-- /ko -->
                    </div>
                    <!-- /ko -->
                    <!-- ko if: $root.device.ggLoadoutsEnabled() -->
                    <div data-bind="configLoadoutIcons: { configID: id, deviceID: deviceId }"></div>
                    <!-- /ko -->
                  </li>
                </ul>
                <!-- ko if: device.configsEsports().length > 0 -->
                <h4 class="railHeader">
                  <span data-bind="localizedText: 'deviceConfig.esportsPlayer.header'"></span>
                </h4>
                <ul class="railListing configs sseConfigs" id="EsportsPlayersConfigurationsList" data-bind="foreach: { data: device.configsEsports, afterRender: device.applyDraggableBindings }, contextmenu: {items: device.configMenuItems}">
                  <li class="config esports-player hasContextMenu" data-bind="css: {selected: selected(), dragging: $root.device.draggingSoftwareConfig() == $data}, click: $root.device.selectConfigIfNoChanges">
                    <div class="playerIcon" data-bind="css: 'player-' + extraProperties.esports_player.icon_class"></div>
                    <div class="playerInfo">
                      <a class="itemName" href="javascript:void(0)" data-bind="text: extraProperties.esports_player.name"></a>
                      <a class="teamName" href="javascript:void(0)" data-bind="text: extraProperties.esports_player.team"></a>
                    </div>
                    <span class="icon cogIcon" data-bind="openContextmenu: {trigger: 'left'}"></span>
                    <!-- ko if: (!$root.device.ggLoadoutsEnabled() && (appsModel.applications().length > 0)) -->
                    <div class="applications" data-bind="foreach: appsModel.applications">
                      <img data-bind="visible: imagePath, attr: {src: imagePath}">
                      <div class="defaultIcon" data-bind="visible: !imagePath">
                        <span data-bind="text: name[0]"></span>
                      </div>
                    </div>
                    <!-- /ko -->
                    <!-- ko if: $root.device.ggLoadoutsEnabled() -->
                    <div data-bind="configLoadoutIcons: { configID: id, deviceID: deviceId }"></div>
                    <!-- /ko -->
                  </li>
                </ul>
                <!-- /ko -->
                <div class="dropContent">
                  <div class="dropContentBorder">
                    <span class="dropContentText" data-bind="localizedText: 'deviceConfig.dragHere'">Drag Here</span>
                  </div>
                </div>
                <div class="dropContent hover">
                  <div class="dropContentBorder">
                    <span class="dropContentText" data-bind="localizedText: 'deviceConfig.drop'">Drop</span>
                  </div>
                </div>
              </div>
              <!-- /ko -->
              <!-- ko if: device.hasOnboardContent -->
              <div class="onboardContent sseConfigsContainer scrollableContainer vertical skinny" data-bind="css: { draggingTo: device.draggingOnboardProfile, dropping: device.droppingOnboardProfile, drophover: device.draggingOnboardProfileOverConfigs }">
                <ul class="railListing configs sseConfigs" id="ConfigurationsList" data-bind="foreach: { data: device.configsNormal, afterRender: device.applyDraggableBindings }, contextmenu: {items: device.configMenuItems}">
                  <li class="config hasContextMenu" data-bind="css: {selected: selected(), dragging: $root.device.draggingSoftwareConfig() == $data}, click: $root.device.selectConfigIfNoChanges">
                    <a class="itemName" href="javascript:void(0)" data-bind="text: name"></a>
                    <span class="icon cogIcon" data-bind="openContextmenu: {trigger: 'left'}"></span>
                    <!-- ko if: (!$root.device.ggLoadoutsEnabled() && (appsModel.applications().length > 0)) -->
                    <div class="applications" data-bind="foreach: appsModel.applications">
                      <!-- ko if: hasSpecialIconCss() -->
                      <div data-bind="attr: {class: specialIconCss}"></div>
                      <!-- /ko -->
                      <!-- ko if: !hasSpecialIconCss() -->
                      <img data-bind="attr: {src: imagePath}, css: {'default_app_icon': !hasImagePath()}">
                      <!-- /ko -->
                    </div>
                    <!-- /ko -->
                    <!-- ko if: $root.device.ggLoadoutsEnabled() -->
                    <div data-bind="configLoadoutIcons: { configID: id, deviceID: deviceId }"></div>
                    <!-- /ko -->
                  </li>
                </ul>
                <!-- ko if: device.configsEsports().length > 0 -->
                <h4 class="railHeader">
                  <span data-bind="localizedText: 'deviceConfig.esportsPlayer.header'"></span>
                </h4>
                <ul class="railListing configs sseConfigs" id="EsportsPlayersConfigurationsList" data-bind="foreach: { data: device.configsEsports, afterRender: device.applyDraggableBindings }, contextmenu: {items: device.configMenuItems}">
                  <li class="config esports-player hasContextMenu" data-bind="css: {selected: selected(), dragging: $root.device.draggingSoftwareConfig() == $data}, click: $root.device.selectConfigIfNoChanges">
                    <div class="playerIcon" data-bind="css: 'player-' + extraProperties.esports_player.icon_class"></div>
                    <div class="playerInfo">
                      <a class="itemName" href="javascript:void(0)" data-bind="text: extraProperties.esports_player.name"></a>
                      <a class="teamName" href="javascript:void(0)" data-bind="text: extraProperties.esports_player.team"></a>
                    </div>
                    <span class="icon cogIcon" data-bind="openContextmenu: {trigger: 'left'}"></span>
                    <!-- ko if: (!$root.device.ggLoadoutsEnabled() && (appsModel.applications().length > 0)) -->
                    <div class="applications" data-bind="foreach: appsModel.applications">
                      <img data-bind="visible: imagePath, attr: {src: imagePath}">
                      <div class="defaultIcon" data-bind="visible: !imagePath">
                        <span data-bind="text: name[0]"></span>
                      </div>
                    </div>
                    <!-- /ko -->
                    <!-- ko if: $root.device.ggLoadoutsEnabled() -->
                    <div data-bind="configLoadoutIcons: { configID: id, deviceID: deviceId }"></div>
                    <!-- /ko -->
                  </li>
                </ul>
                <!-- /ko -->
              </div>
              <!-- /ko -->

              <footer>
                <ul class="btnList horizontal">
                  <li>
                    <button data-bind="click: device.createNewConfig" class="railBtn compressedBtn">
                      <i class="icon newIcon"></i>
                      <span class="buttonLabel" data-bind="localizedText: 'common.new'">New</span>
                    </button>
                  </li>
                </ul>
              </footer>
            </div> <!-- railContent -->
          </div>  <!-- rail -->

          <!-- MAIN CONTENT AREA -->
          <div class="main">
            <div id="PillBanner" data-bind="css: { visible: device.showPillBanner() }">
              <header class="configPageHeaderWithPill" data-bind="visible: device.showSelectedConfigWithPill">
                <h1 class="headerText" data-bind="localizedText: 'main.configurationLabel', visible: device.showConfigTitle"></h1>
                <h1 class="headerText" data-bind="text: ': ', visible: device.showConfigTitle"></h1>
                <h1 class="headerText" data-bind="text: device.selectedConfig()?.name"></h1>
              </header>
              <div id="SonarPill" class="pill" data-bind="visible: device.showSonarPillBanner(), css: { audioLite: device.isAudioLiteDevice }">
                <span data-bind="template: { name: 'sonarBanner', data: device}"></span>
              </div>
              <div id="PrismPill" class="pill" data-bind="visible: device.isBloomLightingDevice() && !device.isBluetoothConnected()">
                <!-- Use default message, unless there's a device-specific text in device.js -->
                <span data-bind="localizedText: { key: device.bloomPermalinkText ? device.bloomPermalinkText : 'deviceConfig.bloom.permaLinkPill'}"></span>
                <a href="javascript:void(0)" class="link" data-bind="click: device.goToBloom, localizedText: 'deviceConfig.bloom.permaLinkPillLabel'"></a>
              </div>
              <div id="RapidTriggerPill" class="pill" data-bind="visible: device.showRapidTriggerPillBanner">
                <span data-bind="localizedText: { key: 'deviceConfig.rapidTrigger.newActuationFeature', suffix: ': ' }"></span>
                <i class="rapidTriggerIcon"></i>
                <span data-bind="localizedText: 'widgets.actuation.rapidTrigger.title'"></span>
                <a href="javascript:void(0)" class="link" data-bind="click: device.openURL.bind(null, 'https://steelseries.com/blog/explaining-rapid-trigger-new-steelseries-keyboard-feature-991'), localizedText: 'common.learnMore'"></a>
              </div>
              <div id="ProtectionModePill" class="pill" data-bind="visible: device.showProtectionModePillBanner">
                <span data-bind="localizedText: { key: 'deviceConfig.rapidTrigger.newActuationFeature', suffix: ': ' }"></span>
                <i class="protectionModeIcon"></i>
                <span data-bind="localizedText: 'widgets.actuation.protectionMode.title'"></span>
                <a href="javascript:void(0)" class="link" data-bind="click: device.openURL.bind(null, 'https://steelseries.com/gg/protection-mode/learn-more'), localizedText: 'common.learnMore'"></a>
              </div>
              <!-- Since the old header is hidden, copy the product info into the Pill banner -->
              <a class="productInfo" data-bind="click: device.openURL.bind(null, device.helpUrl), visible: device.helpUrl">
                <span class="productInfoLabel" data-bind="localizedText: 'deviceConfig.infoAndHelp'"></span>
                <span class="productInfoIcon"></span>
              </a>
            </div>
            <!--ko if: device.selectedConfig()-->
            <header class="configPageHeader" data-bind="visible: !device.showPillBanner() && !device.hideConfigPageHeader()">
              <h1 class="headerText" data-bind="localizedText: 'main.configurationLabel', visible: device.showConfigTitle"></h1>
              <h1 class="headerText" data-bind="text: ': ', visible: device.showConfigTitle"></h1>
              <h1 class="headerText" data-bind="text: device.selectedConfig().name"></h1>
              <a class="productInfo" data-bind="click: device.openURL.bind(null, device.helpUrl), visible: device.helpUrl" style="display: none">
                <span class="productInfoLabel" data-bind="localizedText: 'deviceConfig.infoAndHelp'"></span>
                <span class="productInfoIcon"></span>
              </a>
            </header>

            <!-- esports player widget -->
            <!-- widget should always be in the DOM so the fixed scroll code can always scroll it -->
            <div id="esportsPlayerWidget" style="display: none;" data-bind="visible: device.selectedConfig().extraProperties.esports_player != null">
              <!-- ko if: device.selectedConfig().extraProperties.esports_player != null -->
              <!-- ko with: device.selectedConfig().extraProperties.esports_player -->
              <div class="portrait" data-bind="css: 'portrait-' + icon_class"></div>
              <div class="info">
                <div class="name" data-bind="text: name"></div>
                <div class="team">
                  <span data-bind="localizedText: { key: 'common.team', suffix: ': ' }"></span>
                  <span data-bind="text: team"></span>
                </div>
                <div class="learnMoreContainer">
                  <button class="negative" data-bind="localizedText: 'common.learnMore', click: $parent.device.openURL.bind(null, url)"></button>
                </div>
              </div>
              <!-- /ko -->
              <!-- /ko -->
            </div>
            <div class="content scrollableContainer horizontal vertical" data-bind="template: {name: device.settingsTemplate(), afterRender: device.onTemplateLoaded }"></div>

            <footer>
              <div class="content">
                <div class="footerSection left">
                  <div class="content">
                    <button class="iconSpacer" data-bind="event: { mouseup: device.showConfigs }" id="ShowConfigsBtn">
                      <i class="icon configIcon"></i>
                      <span data-bind="localizedText: 'deviceConfig.showConfigsBtn'">Configs</span>
                    </button>
                  </div>
                </div>

                <div class="footerSection middle">
                  <div class="content">
                    <div data-bind="template: {name: 'LivePreviewTemplate'}"></div>
                  </div>
                </div>

                <div class="footerSection right">
                  <div class="content">
                    <button class="revert negative" data-bind="enable: device.selectedConfig()?.hasConfigChanged() || device.hasGlobalDeviceSettingsChanged(), click: device.reloadSelectedConfig, localizedText: 'common.revert', css: { saving: device.isSaving }" disabled="disabled">Revert</button>
                    <button class="save positive" data-bind="enable: device.selectedConfig()?.hasConfigChanged() || device.hasGlobalDeviceSettingsChanged(), click: device.saveConfig, localizedText: 'common.save', css: { saving: device.isSaving }" disabled="disabled">Save</button>
                  </div>
                </div>
              </div>
            </footer>
            <!--/ko-->
          </div> <!-- main -->
        </section>
      </div> <!-- Container -->
    </div> <!-- ContainerFlex -->

    <div id="ConfigModal" title="" data-bind="with: device">
      <div class="modalContainer">

        <div id="configNameValidation" class="validationError withAlert" data-bind="visible: configModelForDialog.nameErrors().length > 0">
          <div class="content">
            <!-- ko foreach: configModelForDialog.nameErrors -->
            <span class="errTxt" data-bind="html: $data"></span>
            <!-- /ko -->
          </div>
        </div>

        <div class="config">
          <label for="ConfigName" data-bind="localizedText: {key: 'deviceConfig.configName', suffix: ':'}"></label>
          <input type="text" id="ConfigName" maxlength="50" data-bind="value: configModelForDialog.configName, valueUpdate:'afterkeydown'">
        </div>

        <!-- ko ifnot: ggLoadoutsEnabled -->
        <div class="applicationsSection" data-bind="visible: allowApplicationBindings">
          <label data-bind="localizedText: {key: 'deviceConfig.applicationAutoLaunch', suffix: ':'}"></label>
          <div class="applicationsContainer">
            <div class="applications scrollableContainer vertical">
              <ul class="apps">
                <li>
                  <div class="appSelector" data-bind="appSelector: configModelForDialog.newApplication"></div>
                </li>
                <!-- ko foreach: configModelForDialog.config().appsModel.applications -->
                <li class="app" data-bind="click: selectAppForDissociation, css: {readyToRemove: selectedForDissociation()}">
                  <!-- ko if: hasSpecialIconCss() -->
                  <div data-bind="attr: {class: specialIconCss}"></div>
                  <!-- /ko -->
                  <!-- ko if: !hasSpecialIconCss() -->
                  <img data-bind="attr: {src: imagePath}, css: {'default_app_icon': !hasImagePath()}">
                  <!-- /ko -->
                  <div class="name" data-bind="text: displayName"></div>
                </li>
               <!-- /ko -->
              </ul>
            </div>

            <div class="appDissociate">
              <div class="appValidationErrorsExist" data-bind="visible: configModelForDialog.appErrors().length > 0, event: {mouseover: configModelForDialog.toggleDisplayAppValidationErrors, mouseout: configModelForDialog.toggleDisplayAppValidationErrors}"></div>
              <div class="appValidationErrorList validationError bottomArrow" data-bind="visible: configModelForDialog.displayAppValidationErrors()">
                <div class="content">
                  <!-- ko foreach: configModelForDialog.appErrors -->
                  <span class="errTxt" data-bind="html: $data"></span>
                  <!-- /ko -->
                </div>
              </div>

              <div class="removeApp" data-bind="click: configModelForDialog.delete, css : {somethingToRemove: configModelForDialog.config().anyAppsReadyToDissociate()}"></div>
            </div>
          </div>
        </div>
        <!-- /ko --> <!-- end if ggLoadoutsEnabled -->
      </div>
    </div>

    <div id="ConfirmationModal" class="content" title="" style="display: none">
      <div class="header">
        <p class="headerText"></p>
      </div>
      <p class="text indented"></p>
      <p class="textLine2 indented"></p>
      <p class="textLine3 indented"></p>
      <div class="custom"></div>
      <p class="textAfterCustom"></p>
      <ul class="customList"></ul>
      <p class="checkboxContainer">
        <input type="checkbox" id="ConfirmationModalCheckbox">
        <label for="ConfirmationModalCheckbox" class="checkboxLabel"></label>
      </p>
    </div>

    <div id="MessageDialog" class="content" title="" style="display: none">
      <p>
        <label></label>
        </p><div class="infoForLabel"></div>
        <p class="text"></p>
        <p class="textLine2"></p>
        <p class="textLine3"></p>
      <p></p>
    </div>

    <!-- ko if: device.mouseSettings() != null -->
    <div id="WindowsCPIFixer" class="content" title="" style="display: none">
      <div class="windowsCPIOneButtonFix">
        <label class="downloadNotificationSettingsHeader" data-bind="localizedText: 'main.windowsCPI.mouseAcceleration'"></label>
        <label class="explanationLabel" data-bind="localizedText: 'main.windowsCPI.mouseAccelerationExplanation'"></label>
        <div class="cpiSetting">
          <label class="checkLabel" data-bind="localizedText: 'main.windowsCPI.enhancedpointer'"></label>
          <label class="acceleration CPIon" data-bind="visible: device.mouseSettings().accel != 0, localizedText: 'common.on'"></label>
          <label class="acceleration CPIoff" data-bind="visible: device.mouseSettings().accel == 0, localizedText: 'common.off'"></label>
        </div>
        <div class="cpiSetting cpiSettingLast">
          <label class="checkLabel" data-bind="localizedText: {key: 'main.windowsCPI.pointerSpeed', suffix: ': '}"></label>
          <label class="speedMultiplier CPIon" data-bind="visible: device.mouseSettings().speed != 10, localizedText: 'main.windowsCPI.hasMultiplier'"></label>
          <label class="speedMultiplier CPIoff" data-bind="visible: device.mouseSettings().speed == 10, localizedText: 'main.windowsCPI.noMultiplier'"></label>
        </div>
        <div class="cpiSetting cpiSettingCheckbox">
          <input class="black" type="checkbox" id="cpiSettingsDontShowAgain">
          <label for="cpiSettingsDontShowAgain" data-bind="localizedText: 'common.dontShowThisAgain'"></label>
        </div>
        <div class="cpiButtons">

    </div>
    <div class="protectionModeBanner" data-bind="visible: hasProtectionMode">
      <i class="protectionModeIcon"></i>
      <span data-bind="localizedText: 'widgets.actuation.protectionMode.title'"></span>

    </div>

    <div class="groupContent">
      <div class="mapListHeader" data-bind="css: {rapidTriggerColumns: hasRapidTrigger, protectionModeColumns: hasProtectionMode}">
        <label class="keyLabel" data-bind="localizedText: 'common.keyboardKey'"></label>
        <label class="actuationLabel" data-bind="localizedText: 'widgets.actuation.title', localizedTitle: 'widgets.actuation.title'"></label>
        <!-- ko if: hasRapidTrigger -->
          <i class="rapidTriggerIcon"></i>
          <input type="checkbox" class="rapidTriggerToggle" data-bind="checked: toggleRapidTrigger, disable: keysSelected().length === 0, localizedTitle: keysSelected().length === 0 ? null : 'common.selectUnselectAll', tooltip: { hover: true }"/>
        <!-- /ko -->
        <!-- ko if: hasProtectionMode -->
          <i class="protectionModeIcon"></i>
          <input type="checkbox" class="protectionModeToggle" data-bind="checked: toggleProtectionMode, disable: keysSelected().length === 0, localizedTitle: keysSelected().length === 0 ? null : 'common.selectUnselectAll', tooltip: { hover: true }"/>
        <!-- /ko -->
      </div>
      <ul class="groupList">
        <li class="group">
          <div class="content contentFixedHeight">
            <label class="selectKeysLabel" data-bind="visible: keysSelected().length === 0, localizedText: hasRapidTrigger ? 'widgets.actuation.selectKeysWithRapidTrigger' : 'widgets.actuation.selectKeys'"></label>
            <ul class="mapList" data-bind="foreach: keysSelected">
              <li data-bind="css: {rapidTriggerColumns: $parent.hasRapidTrigger, protectionModeColumns: $parent.hasProtectionMode}">
                <span class="buttonName" data-bind="text: label, css: { selected: isSelected() }"></span>
                <div class="action" data-bind="
                  text: valueDisplayText,
                  attr: {
                    'data-hotspot': 'code' + hid(),
                  },
                ">
                </div>
                <!-- ko if: $parent.hasRapidTrigger -->
                  <i class="rapidTriggerIcon"></i>
                  <input type="checkbox" class="rapidTriggerToggle" data-bind="checked: rapidTriggerCheckbox"/>
                <!-- /ko -->
                <!-- ko if: $parent.hasProtectionMode -->
                  <i class="protectionModeIcon"></i>
                  <input type="checkbox" class="protectionModeToggle" data-bind="checked: protectionModeCheckbox"/>
                <!-- /ko -->
              </li>
            </ul>
          </div>
        </li>
      </ul>
    </div>

    <button class="reset-button" data-bind="click: onResetButtonClick, localizedText: 'common.resetAll'"></button>

    <section class="buttonMarkers" data-bind="css: 'tool-' + currentTool()">
      <ul class="zones" data-bind="foreach: { data: keySelectables, afterRender: selectionTools.recacheKeyNodes }">
        <!--ko if: hid() -->
        <li class="zone ui-selected" data-bind="
          event: {
            click: $parent.zoneClick,
            mousedown: $parent.zoneDown,
            mouseenter: $parent.zoneEnter,
            mouseleave: $parent.zoneLeave,
          },
          attr: {
            'data-code': hid(),
            'data-hotspot': 'code' + hid(),
          },
          css: $parent.zoneCss(hid()),
          tooltip: { hover: true },
          localizedTitle:
            $parent.hasRapidTrigger &&
            $parent.showRapidTriggerIcons &&
            $parent.rapidTriggerKeys().includes(hid()) &&
            $parent.dualActuationKeys().includes(hid()) ?
              'widgets.actuation.rapidTrigger.dualActuationRapidTriggerConflictTooltip' :
              null,
        ">
          <div href="javascript:void(0)" data-bind="
            event: {
              mouseover: mouseover,
              mouseout: mouseout,
            },
          ">
          </div>
          <div class="keyBorder"></div>
          <!-- NOTE: keep these in stacking order for proper display -->
          <!--ko if: $parent.showProtectionModeIcons-->
            <i class="protectionModeIcon" data-bind="visible: $parent.protectionModeKeys().includes(hid())"></i>
          <!--/ko-->
          <!--ko if: $parent.showRapidTriggerIcons-->
            <i class="rapidTriggerIcon" data-bind="visible: $parent.rapidTriggerKeys().includes(hid()), css: { hasSecondActuationBinding: $parent.dualActuationKeys().includes(hid()) }"></i>
          <!--/ko-->
        </li>
        <!--/ko-->
      </ul>
    </section>
  </div>
</script>

  <a href="javascript:void(0)" class="tooltip" data-bind="localizedTitle: $data.customTooltip || 'widgets.tooltip.anglesnapping', tooltip: {}"></a>
  <div class="content" data-bind="angleSnap: snapLevel">
    <div class="illustrationContainer">
      <div class="leftCursor"></div>
      <div class="snapSetting"></div>
      <div class="rightCursor"></div>
    </div>
    <div class="angleSnapControl">
      <div class="wigglyIcon"></div>
      <div class="sliderWidget" data-bind="template: {name: 'horizSlider', data: {options: snapLevelRange, value: snapLevel } }"></div>
      <div class="straightIcon"></div>
    </div>
  </div>
</script>

<script type="text/html" id="auto_mic_gain">
  <div id="AutoMicGain" class="widget">
    <div class="title" data-bind="localizedText: titleLocaleKey"></div>
    <a href="javascript:void(0)" class="tooltip" data-bind="localizedTitle: tooltipLocaleKey, tooltip: {}"></a>

    <div class="content">
      <div class="graph">
        <div class="graphLines">
          <div class="soundWave" data-bind="css: {on: toggleField(), off: !toggleField()}">
          </div>
        </div>
      </div>
      <div class="toggleButton" data-bind="toggle: {field: toggleField, numerical: numericalValues}">
        <label class="labelButton" data-bind="css: {on: toggleField()}"></label>
        <label class="before" data-bind="localizedText: 'common.on'"></label>
        <label class="after" data-bind="localizedText: 'common.off'"></label>
      </div>
    </div>
  </div>
</script>
<script type="text/html" id="afkLightingEffect">
  <div class="afkLightingEffect" data-bind="afkLightingEffect: { ...$data }">

    <header class="afkLightingEffect__header">
      <span class="afkLightingEffect__title" data-bind="localizedText: 'widgets.advancedLighting.afkEffect.title'"></span>

      <span class="afkLightingEffect__subtitle" data-bind="localizedText: 'widgets.advancedLighting.afkEffect.subtitle'"></span>
    </header>

    <div class="afkLightingEffect__content">

      <div class="afkLightingEffect__effect-dropdown dropdownContainer" data-bind="dropdown: onSelectEffectFromDropdown">
        <a href="javascript:void(0)" class="dropdownButton withArrow" data-bind="localizedText: selectedEffectLocalizationKey()"></a>
        <div class="dropdownContent topGradient">
          <div class="scrollableArea">
            <ul data-bind="foreach: effectDropdownOptions">
              <li class="afkLightingEffect__dropdown-option" data-bind="localizedText: localizationKey,
                style: { paddingLeft: $data.noIndent ? '10px' : '25px' }"></li>
              <!-- ko if: $data.hasSeparator -->
              <li class="separator afkLightingEffect__dropdown-option">
                <h4 style="margin-top: 0.5em; margin-bottom: 0;" data-bind="text: separatorTitle"></h4>
              </li>
              <!-- /ko -->
            </ul>
          </div>
        </div>
      </div>

      <div class="colorValueContainer" data-bind="css: { disabled: selectedEffectType() === 'MIXED' }">
        <div class="colorValue" data-bind="click: showDialog, style: { background: currentEffectBackground }">
        </div>
      </div>

      <a class="editLink" data-bind="
        localizedText: 'common.edit',
        css: { disabled: selectedEffectType() === 'MIXED' },
        click: showDialog
      "></a>

      <div data-bind="template:{
          name: 'lightingCustomColorOnly',
          data: {
            singleColor: afkSingleColor,
            steadyColorPresets: steadyColorPresets,
            isVisible: isSingleColorDialogVisible,
          }
        }"></div>

      <div data-bind="template:{
          name: 'lightingCustomColorGradientOnly',
          data: {
            currentEffectGradientPickerData: currentEffectGradientPickerData,
            isVisible: isColorGradientDialogVisible,
            currentSelectedColorStopPositionLeft: currentAfkColorStopPositionLeft,
            effectToStringFn: currentEffectToGradientStringFn(),
            maxHistoryDisplaySize: maxAfkEffectHistoryDisplaySize,
            minHistoryDisplaySize: minAfkEffectHistoryDisplaySize,
          }
        }"></div>
    </div>

    <div class="afkLightingEffect__settings">
      <div class="afkLightingEffect__labeled-control afkLightingEffect__show-after-control">
        <label class="afkLightingEffect__control-label" data-bind="localizedText: 'widgets.advancedLighting.afkEffect.showAfter'"></label>

        <div class="dropdownContainer" data-bind="dropdown: setIdleTimeout">
          <a href="javascript:void(0)" class="deviceConfigBtn dropdownButton withArrow" data-bind="text: selectedIdleTimeoutDisplayValue"></a>

          <div class="dropdownContent topGradient">
            <div class="scrollableArea">
              <ul class="deviceCardConfigs" data-bind="foreach: idleTimeoutValues">
                <li class="deviceCardConfig" data-bind="text: displayValue"></li>
              </ul>
            </div>
          </div>
        </div> <!-- dropdownContainer -->
      </div>

      <div class="afkLightingEffect__labeled-control" data-bind="visible: isSpeedSliderVisible()">
        <label class="afkLightingEffect__control-label"><span data-bind="localizedText: 'common.speed'"></span></label>
        <div class="afkLightingEffect__slider" data-bind="template: {
          name: 'horizSlider',
          data: {
            value: graphic_configuration().foreground.speed,
            options: (effectIsBreathe() ? breatheSpeedValues : speedValues),
            displayTicks: 0,
            noSnapToTicks : true,
            hideMiddleLabels: true,
            replaceTextInHiddenLabels: ['', ''],
          }
        }">
        </div>
      </div>

      <div class="afkLightingEffect__labeled-control" data-bind="visible: isSizeSliderVisible()">
        <label class="afkLightingEffect__control-label" data-bind="localizedText: 'common.size'"></label>
        <div class="afkLightingEffect__slider" data-bind="template: {
          name: 'horizSlider',
          data: {
            value: graphic_configuration().foreground.scale,
            options: scaleValues,
            displayTicks: 0,
            noSnapToTicks : true,
            hideMiddleLabels: true,
            replaceTextInHiddenLabels: ['', ''],
          }
        }">
        </div>
      </div>

      <div class="afkLightingEffect__labeled-control afkLightingEffect__wave-controls" data-bind="visible: isWaveControlVisible()">
        <label data-bind="localizedText: 'common.wave'"></label>
        <ul class="afkLightingEffect__radio-buttons" data-bind="foreach: waveRadioButtons.options">
          <li class="afkLightingEffect__labeled-radio-button">
            <input class="afkLightingEffect__radio-button" type="radio" data-bind="
              checkedValue: checkedValue,
              checked: waveRadioButtons.checked,
              attr: {
                id: checkedValue + '-AFK'
              }
            "/>
            <label class="afkLightingEffect__radio-button-label" data-bind="
            localizedText: localizationKey,
            attr: {
              for: checkedValue + '-AFK'
            }
            "></label>
          </li>
        </ul>

        <div></div> <!-- grid placeholder div, yes this is hacky -->

        <div>
          <input id="reverse-afk-effect" type="checkbox" data-bind="
            checked: reverseDirection,
          "/>
          <label class="afkLightingEffect__checkbox-label"
                 for="reverse-afk-effect"
                 data-bind="localizedText: 'common.reverse'"></label>
        </div>

      </div>

    </div>

    <div class="afkLightingEffect__control afkLightingEffect__darken-control" data-bind="visible: isDimCheckboxVisible()">
      <div class="afkLightingEffect__checkbox">
        <input id="afk-darken-toggle" type="checkbox" data-bind="checked: idleDimmerEnabled" />
        <label for="afk-darken-toggle" data-bind="localizedText: 'widgets.advancedLighting.afkEffect.darkenByHalf'"></label>
      </div>
    </div>

  </div>
</script>

<script type="text/html" id="batteryPerformance">
    <div class="batteryPerformance">
      <div class="title" data-bind="localizedText: 'widgets.batteryPerformance.title'"></div>
      <a href="javascript:void(0)" class="tooltip"  data-bind="localizedTitle: 'widgets.batteryPerformance.tooltip', tooltip: {}"></a>

      <div class="canister">

        <input class="canisterLevelInput" id="canisterLevelInput" type="range" min="1" max="3" data-bind="attr: {value: $data.gaugeValue }">
        <div class="canisterOoze">
          <div class="canisterCap canisterCapLeft"></div>
          <!-- MAGIC GREEN OOZE HERE -->
          <div class="canisterCap canisterCapRight"></div>
        </div>
      </div>

      <div class="dropdownContainer" data-bind="dropdown: $data.selectPreset, dropdownFlippable: true">
        <a href="javascript:void(0)" class="dropdownButton withArrow" data-bind="text: $data.selectedPresetModel.name"></a>

        <div class="dropdownContent topGradient">
          <div class="scrollableArea">
            <ul class="presets" data-bind="foreach: $data.presets">
              <li class="" data-bind="text: name"></li>
            </ul>
          </div>
        </div>
      </div> <!-- dropdownContainer -->


      <div class="content" data-bind="with: $data.selectedPresetModel">

        <!-- PRESETS -->
        <div class="control">
          <div data-bind="localizedText: 'widgets.batteryPerformance.sleepTimer'"></div>

          <div class="sleepTimeControl" data-bind="with: sleepTimer">
            <div class="sliderWidget" data-bind="template: {name: 'horizSlider', data: {value: value, options: options, displayOptions: optionsMinutes, suffix: 'm'}}"></div>
            <label class="sleepTime" data-bind="text: `${valueMinutes()}m`"></label>

          </div>
        </div>

        <!-- SENSOR SMART MODE -->
        <div class="control" data-bind="with: sensorRest, localizedTitle: 'widgets.batteryPerformance.sensorTooltip', tooltip: { hover: true }">
          <div class="smartSensor">
            <div class="modeToggle">
              <div class="toggleButton smallToggleButton" data-bind="toggle: {field: field, numerical: numerical}">
                <label class="labelButton" data-bind="css: {on: field()}"></label>
                <label class="before" data-bind="localizedText: 'common.on'"></label>
                <label class="after" data-bind="localizedText: 'common.off'"></label>
              </div>
            </div>
            <label class="toggleLabel" data-bind="localizedText: 'widgets.batteryPerformance.smartSensorMode'"></label>
          </div>
        </div>

        <!-- ILLUMINATION SMART MODE -->
        <div class="control" data-bind="with: smartIllumination, localizedTitle: 'widgets.batteryPerformance.illuminationTooltip', tooltip: { hover: true }">
          <div class="illuminationMode">
            <div class="modeToggle">
              <div class="toggleButton smallToggleButton" data-bind="toggle: {field: field, numerical: numerical}">
                <label class="labelButton" data-bind="css: {on: field()}"></label>
                <label class="before" data-bind="localizedText: 'common.on'"></label>
                <label class="after" data-bind="localizedText: 'common.off'"></label>
              </div>
            </div>
            <label class="toggleLabel" data-bind="localizedText: 'widgets.batteryPerformance.illuminationMode'"></label>
          </div>
        </div>

      </div>
    </div>

</script>

    </div>
    <!--/ko-->
    <!--ko if: typeof model.mode == "undefined"-->
    <div class ="colorPickerContainer" data-bind="template: {name: 'colorPicker', data: { color: { red: model.color.red, green: model.color.green, blue: model.color.blue }, pickerDisabled: model.pickerDisabled, disabledReason: model.disabledReason, disabledReasonCss: model.disabledReasonCss, registerSaveHistoryCb: registerSaveHistoryCb, registerReloadHistoryCb: registerReloadHistoryCb, unregisterHistoryCallbacks: unregisterHistoryCallbacks, registerSaveColorCb: registerSaveColorCb, pickerHidden: model.pickerHidden, historyHidden: model.historyHidden, saveButton: model.saveButton } }, css: { pickerHidden: model.pickerHidden }">

      <div data-bind="template: {name: 'brightnessSlider', data: { canAdjustBrightness: !model.brightness.dummy, brightness: model.brightness.level, illuminationDisabled: model.illuminationDisabled, brightnessValues: $root.device.brightnessValues, brightnessLabels: $root.device.brightnessLabels } }, css: { displayNone: model.illuminationDisabled, hidden: model.effects.pulsationMode() == 5 }">
      </div>

          <div class="lightingControl dropdownContainer" data-bind="dropdown: model.effects.lightingEffect, dropdownDisabled: model.illuminationDisabled">

<script type="text/html" id="lightingCustom">

<div class="LightingCustomContainer" data-bind="lightingCustom: lightingCustomModel">
  <div class="clickableArea" data-bind="click: showDialog">
    <div class="helperBlock"></div>

    <!-- ko if: label -->
    <span class="title" data-bind="text: label"></span>
    <!--/ko-->

    <div class="colorValue" data-bind="style: { background: computedBackground }"></div>

    <!-- ko if: extraAreaOverlay -->
    <div class="areaOverlay" data-bind="style: computedAnimationStyles">
      <div class="extraShape extraShape1"></div>
      <div class="extraShape extraShape2"></div>
      <div class="extraShape extraShape3"></div>
    </div>
    <!-- /ko -->

    <div class="LightingCustom" data-bind="visible: dialogVisible()">
      <!-- To do the fancy flex titlebar styling stuff, we must use CSS to hide the real titlebar
           and then create this fake titlebar with the appropriate things inside
      -->
      <div class="ui-dialog-titlebar ui-widget-header ui-corner-all ui-helper-clearfix ui-draggable-handle not-hidden">
        <!-- Fake title for fake titlebar -->
        <h5 class="ui-dialog-title" data-bind="text: dialogTitle"></h5>

        <!-- EFFECT CHOICE DROPDOWN -->
        <div class="cf chooseEffect">
            <div class="lightingControl dropdownContainer" data-bind="dropdown: selectEffect">
                <a href="javascript:void(0)" class="dropdownButton withArrow" data-bind="text: currentEffectLocalizedText()"></a>
                <div class="dropdownContent topGradient">
                    <div class="scrollableArea">
                        <ul class="lightingEffects" data-bind="foreach: availEffects">
                              <li class="lightingEffect" data-bind="localizedText: localizationKey"></li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
      </div>

      <!-- Placement hack, needed for the border/shadow placement Emily wanted -->
      <div class="titleSeparator"></div>

      <div class="dialogContent" data-bind="css: { steady: effectIsSteady(), colorShift: effectIsColorshift(), breathe: effectIsBreathe(), reactive: effectIsReactive(), disabled: effectIsDisabled(), legacyBreathe: effectIsLegacyBreathe(), audioTrigger: effectIsAudioTrigger(), batteryStatus: effectIsBatteryStatus(), isMultiZone: isMultiZone }">

        <div class="lightingCustomCol1">

          <!-- LEGACY BREATHE SPEED -->
          <!-- ko if: effectIsLegacyBreathe() -->
          <div class="legacyBreatheSpeed">
            <div class="title" data-bind="localizedText: { key: 'widgets.speedWithPlaceholder', '#PLACEHOLDER#': currentEffectSpeedLabelLocalizedText()}"></div>
            <div data-bind="template: {name: 'horizSlider', data: {options: $root.device.breatheSpeeds, value: legacyBreatheValue} }"></div>
          </div>
          <hr>
          <!-- /ko -->

          <!-- BATTERY STATUS LABEL -->
          <!-- ko if: effectIsBatteryStatus() -->
          <div class="batteryStatus">
            <div class="title" data-bind="localizedText: 'widgets.led.effects.batteryStatus'"></div>

            <div class="batteryStatusContainer">
              <div class="batteryContainer batteryFull">
                <i class="iconBattery iconBatteryFull"></i>
              </div>
              <div class="batteryContainer batteryUsed">
                <i class="iconBattery iconBatteryUsed"></i>
              </div>
              <div class="batteryContainer batteryDepleted">
                <i class="iconBattery iconBatteryDepleted"></i>
              </div>
            </div>
          </div>
          <hr>
          <!-- /ko -->

          <!-- COLOR PICKER FOR STEADY -->
          <div class="steadyColorPickerContainer" data-bind="visible: effectIsSteady() || effectIsLegacyBreathe() || effectIsAudioTrigger() || effectIsBatteryStatus() || effectIsMsiBuiltin()">
            <div class="title" data-bind="localizedText: 'widgets.colorPicker.title'"></div>
            <div class="picker">
              <div class="colorPickerContainer" data-bind="template: {name: 'colorPicker', data: { color: { red: steadyColorObservables.red, green: steadyColorObservables.green, blue: steadyColorObservables.blue }, pickerDisabled: pickerDisabled, disabledReason: pickerDisabledReason, disabledReasonCss: '', registerSaveHistoryCb: registerSaveHistoryCb, registerReloadHistoryCb: registerReloadHistoryCb, unregisterHistoryCallbacks: unregisterHistoryCallbacks, registerSaveColorCb: registerSaveColorCb, pickerHidden: false, historyHidden: false, saveButton: false } }"></div>
            </div>
          </div>

          <div class="multiSpeedContainer" data-bind="if: dialogVisible(), visible: (effectIsColorshift() || effectIsBreathe() || effectIsReactive())">

            <div class="title sliderTitle speed" data-bind="localizedText: { key: 'widgets.speedWithPlaceholder', '#PLACEHOLDER#': currentEffectSpeedLabelLocalizedText()}"></div>

            <!-- SPEED FOR COLORSHIFT -->
            <div class="speed" data-bind="visible: effectIsColorshift()">
              <div class="sliderContainer" data-bind="template: {name: 'horizSlider', data: {
                options: speedVals,
                displayTicks: 2,
                value: colorshiftSpeedObservable,
                noSnapToTicks: true,
              } }"></div>
              <div class="speedInputWrapper">
                <input type="number" maxlength="10" class="colorShiftInput speedInput" data-bind="value: colorShiftValue, event: { blur: colorShiftEdit}, blurOnEnter: true"></input>
                <label class="speedInputSecondsLabel" data-bind="localizedText: 'common.secondsNonAbbreviated'"></label>
              </div>
            </div>

            <!-- SPEED FOR BREATHE -->
            <div class="speed" data-bind="visible: effectIsBreathe()">
              <div class="sliderContainer" data-bind="template: {name: 'horizSlider', data: {
                options: speedVals,
                displayTicks: 2,
                value: breatheSpeedObservable,
                noSnapToTicks: true
              } }"></div>
              <div class="speedInputWrapper">
                <input type="number" maxlength="10" class="breathInput speedInput" data-bind="value: breatheValue, event: {blur: breatheEdit}, blurOnEnter: true"></input>
                <label class="speedInputSecondsLabel" data-bind="localizedText: 'common.secondsNonAbbreviated'"></label>
              </div>
            </div>

            <!-- SPEED FOR REACTIVE -->
            <div class="speed" data-bind="visible: effectIsReactive()">
              <div class="sliderContainer" data-bind="template: {name: 'horizSlider', data: {
                options: reactiveTimeValues,
                displayTicks: 2,
                value: reactColorObservables()[1].time,
                noSnapToTicks: true
              } }"></div>
              <div class="speedInputWrapper">
                <input type="number" maxlength="10" class="reactInput speedInput" data-bind="value: reactiveValue, event: {blur: reactiveEdit}, blurOnEnter: true"></input>
                <label class="speedInputSecondsLabel" data-bind="localizedText: 'common.secondsNonAbbreviated'"></label>
              </div>
            </div>

            <!-- Post-speed horizontal divider -->
            <hr class="postSpeedDivider">

          </div>

          <!-- for dual color widget -->
          <div class="multiZoneContainer" data-bind="if: dialogVisible(), visible: isMultiZone &amp;&amp; (effectIsColorshift() || effectIsBreathe())">
            <div class="title" data-bind="localizedText: 'widgets.multiZone.behavior'"></div>

            <!-- dual color options -->
            <div class="multiZoneButtonsContainer">
              <button class="multiColorOptionOne multiColorButton" data-bind="localizedTitle: 'widgets.multiZone.sweep', event: {click: multiZoneState.bind(null, 1)}, css: { active: multiZoneState() == 1, reverse: multiZoneReverse() }, tooltip: { hover: true, delay: 1000, right: true }"><div class="multiZoneIcon"></div></button>
              <button class="multiColorOptionTwo multiColorButton" data-bind="localizedTitle: 'widgets.multiZone.synchronized', event: {click: multiZoneState.bind(null, 2)}, css: { active: multiZoneState() == 2, reverse: multiZoneReverse() }, tooltip: { hover: true, delay: 1000, right: true }"><div class="multiZoneIcon"></div></button>
              <button class="multiColorOptionThree multiColorButton" data-bind="localizedTitle: 'widgets.multiZone.reflected', event: {click: multiZoneState.bind(null, 3)}, css: { active: multiZoneState() == 3, reverse: multiZoneReverse() }, tooltip: { hover: true, delay: 1000, right: true }"><div class="multiZoneIcon"></div></button>
            </div>

            <div class="multiZoneReverseContainer" data-bind="localizedTitle: 'widgets.multiZone.reverseTooltip', tooltip: { hover: true, delay: 1000 }, css: { disabled: multiZoneState() === 2 }">
              <input type="checkbox" id="reverseEffectCheck" data-bind="checked: multiZoneReverse"></input>
              <label for="reverseEffectCheck" data-bind="localizedText: 'widgets.multiZone.reverseEffectDirection'"></label>
            </div>

            <!-- Post-speed horizontal divider (same as above)-->
            <hr class="postSpeedDivider">
          </div>

          <div class="multiGradientEditorContainer" data-bind="if: dialogVisible(), visible: (effectIsColorshift() || effectIsBreathe() || effectIsReactive())">

            <!-- This label "pattern" is for colorshift and breathe -->
            <div class="title" data-bind="localizedText: { key: 'widgets.patternWithPlaceholder', '#PLACEHOLDER#': currentEffectSpeedLabelLocalizedText()}, visible: (effectIsColorshift() || effectIsBreathe())"></div>

            <!-- This label "color" is for reactive/trigger -->
            <div class="title" data-bind="localizedText: { key: 'widgets.colorWithPlaceholder', '#PLACEHOLDER#': currentEffectLocalizedText()}, visible: effectIsReactive()"></div>

            <!-- GRADIENT EDITOR for COLORSHIFT -->
            <div class="gradientEditorContainer" data-bind="visible: effectIsColorshift()">
              <div data-bind="template: {name: 'custom_gradient', data:{
                colorObservables: colorshiftObservables(),
                positionObservables: colorshiftObservables(),
                maxStops: colorshiftMaxStops,
                effectType: colorshiftEffectType,
                forceResetObservable: colorshiftForceResetObservable,
                forceUpdateObservable: colorshiftForceUpdateObservable,
                numStopsObservable: colorshiftNumStopsObservable,
                pickerInDialog: false,
                colorStopClicksReturnObservable: colorshiftStopInfo
              }}"></div>
            </div>

            <!-- GRADIENT EDITOR for BREATHE -->
            <div class="gradientEditorContainer" data-bind="visible: effectIsBreathe()">
              <div data-bind="template: {name: 'custom_gradient', data:{
                colorObservables: breatheObservables(),
                positionObservables: breatheObservables(),
                maxStops: breatheMaxStops,
                effectType: breatheEffectType,
                forceResetObservable: breatheForceResetObservable,
                forceUpdateObservable: breatheForceUpdateObservable,
                numStopsObservable: breatheNumStopsObservable,
                pickerInDialog: false,
                colorStopClicksReturnObservable: breatheStopInfo
              }}"></div>
            </div>

            <!-- "GRADIENT EDITOR" for REACTIVE -->
            <div class="gradientEditorContainer" data-bind="visible: effectIsReactive()">
              <div data-bind="template: {name: 'custom_gradient', data:{
                colorObservables: reactColorObservables(),
                positionObservables: reactColorObservables(),
                effectType: reactiveEffectType,
                forceResetObservable: reactiveForceResetObservable,
                forceUpdateObservable: reactiveForceUpdateObservable,
                numStopsObservable: reactiveNumStopsObservable,
                pickerInDialog: false,
                posDisplay: reactivePosDisplay,
                posPostfixOverride: '',
                colorStopClicksReturnObservable: reactiveStopInfo}}"></div>
            </div>
          </div>

          <!-- LITTLE ARROW POINTING TO THE PROPER STOP ON THE GRADIENT EDITOR -->
          <i class="icon gradientEditorPositionArrow" data-bind="if: dialogVisible(), visible: (effectIsColorshift()||effectIsReactive()||effectIsBreathe()), style: { left: currentGradientEditorPositionLeft()}"></i>

          <div class="multiColorPickersContainer" data-bind="if: dialogVisible(), visible: (effectIsColorshift() || effectIsReactive() || effectIsBreathe())">
            <div class="title" data-bind="localizedText: 'widgets.colorPicker.title'"></div>

            <!-- COLOR PICKERS FOR COLORSHIFT -->
            <div class="colorShiftColorPickerContainer" data-bind="visible: effectIsColorshift()">
              <div class="picker" data-bind="foreach: colorshiftObservables">
                <div class="colorPickerContainer" data-bind="template: {name: 'colorPicker', data: { color: { red: red, green: green, blue: blue}, pickerDisabled: $parentContext.pickerDisabled, disabledReason: $parentContext.pickerDisabledReason, disabledReasonCss: '', registerSaveHistoryCb: $parentContext.registerSaveHistoryCb, registerReloadHistoryCb: $parentContext.registerReloadHistoryCb, unregisterHistoryCallbacks: $parentContext.unregisterHistoryCallbacks, registerSaveColorCb: $parentContext.registerSaveColorCb, pickerHidden: false, historyHidden: false, saveButton: false } }, visible: $parentContext.colorshiftStopInfo().index==$index()"></div>
              </div>
            </div>

            <!-- COLOR PICKERS FOR BREATHE -->
            <div class="breatheColorPickerContainer" data-bind="visible: effectIsBreathe()">
              <div class="picker" data-bind="foreach: breatheObservables">
                <div class="colorPickerContainer" data-bind="template: {name: 'colorPicker', data: { color: { red: red, green: green, blue: blue}, pickerDisabled: $parentContext.pickerDisabled, disabledReason: $parentContext.pickerDisabledReason, disabledReasonCss: '', registerSaveHistoryCb: $parentContext.registerSaveHistoryCb, registerReloadHistoryCb: $parentContext.registerReloadHistoryCb, unregisterHistoryCallbacks: $parentContext.unregisterHistoryCallbacks, registerSaveColorCb: $parentContext.registerSaveColorCb, pickerHidden: false, historyHidden: false, saveButton: false } }, visible: $parentContext.breatheStopInfo().index==$index()"></div>
              </div>
            </div>

            <!-- COLOR PICKERS FOR REACTIVE -->
            <div class="reactiveColorPickerContainer" data-bind="visible: effectIsReactive()">
              <div class="picker" data-bind="foreach: reactColorObservables">
                <div class="colorPickerContainer" data-bind="template: {name: 'colorPicker', data: { color: { red: red, green: green, blue: blue}, pickerDisabled: $parentContext.pickerDisabled, disabledReason: $parentContext.pickerDisabledReason, disabledReasonCss: '', registerSaveHistoryCb: $parentContext.registerSaveHistoryCb, registerReloadHistoryCb: $parentContext.registerReloadHistoryCb, unregisterHistoryCallbacks: $parentContext.unregisterHistoryCallbacks, registerSaveColorCb: $parentContext.registerSaveColorCb, pickerHidden: false, historyHidden: false, saveButton: false } }, visible: $parentContext.reactiveStopInfo().index==$index()"></div>
              </div>
            </div>
          </div>

          <!-- WHAT TO DISPLAY WHEN DISABLED -->
          <div class="customLightingDisabled" data-bind="if: dialogVisible(), visible: effectIsDisabled()"></div>
        </div>

      <div class="lightingCustomCol2">
        <div class="historyContainer" data-bind="if: dialogVisible(), visible: (effectIsColorshift() || effectIsBreathe() || effectIsReactive() || effectIsLegacyBreathe()), css: { steadyHistory: effectIsSteady(), colorShiftHistory: effectIsColorshift(), breatheHistory: effectIsBreathe(), reactiveHistory: effectIsReactive(), legacyBreatheHistory: effectIsLegacyBreathe(), audioTriggerHistory: effectIsAudioTrigger()}">
          <div class="title" data-bind="localizedText: 'common.history'"></div>
          <!-- HISTORY FOR COLORSHIFT -->
          <!-- ko if: effectIsColorshift() -->
          <div class="history">
            <!-- ko foreach: historyEntries() -->
              <div class="entry colorShift" data-bind="style: { backgroundImage: colorShiftGradientString($data) }, click: $parentContext.applyColorshiftDataObject, visible: ($index() < currentEffect().historyMaxDisplaySizeCustomLightingWidget)"></div>
            <!-- /ko -->

            <!-- EMPTY FILLER HISTORY ENTRIES -->
            <!-- ko foreach: (new Array(currentEffect().historyMinDisplaySizeCustomLightingWidget)).slice(0, currentEffect().historyMinDisplaySizeCustomLightingWidget - Math.min(historyEntries().length, currentEffect().historyMinDisplaySizeCustomLightingWidget)) -->

              <div class="entry empty colorShift"></div>
            <!-- /ko -->
          </div>
          <!-- /ko -->

          <!-- HISTORY FOR BREATHE -->
          <!-- ko if: effectIsBreathe() -->
          <div class="history">
            <!-- ko foreach: historyEntries() -->
              <div class="entry breathe" data-bind="style: { backgroundImage: breatheGradientString($data) }, click: $parentContext.applyBreatheDataObject, visible: ($index() < currentEffect().historyMaxDisplaySizeCustomLightingWidget)"></div>
            <!-- /ko -->

            <!-- EMPTY FILLER HISTORY ENTRIES -->
            <!-- ko foreach: (new Array(currentEffect().historyMinDisplaySizeCustomLightingWidget)).slice(0, currentEffect().historyMinDisplaySizeCustomLightingWidget - Math.min(historyEntries().length, currentEffect().historyMinDisplaySizeCustomLightingWidget)) -->

              <div class="entry empty breathe"></div>
            <!-- /ko -->
          </div>
          <!-- /ko -->

          <!-- HISTORY FOR REACTIVE -->
          <!-- ko if: effectIsReactive() -->
          <div class="history">
            <!-- ko foreach: historyEntries() -->
              <div class="entry reactiveColor" data-bind="style: { background: reactiveBackgroundString($data) }, click: $parentContext.applyReactiveDataObject, visible: ($index() < currentEffect().historyMaxDisplaySizeCustomLightingWidget)"></div>
            <!-- /ko -->

            <!-- EMPTY FILLER HISTORY ENTRIES -->
            <!-- ko foreach: (new Array(currentEffect().historyMinDisplaySizeCustomLightingWidget)).slice(0, currentEffect().historyMinDisplaySizeCustomLightingWidget - Math.min(historyEntries().length, currentEffect().historyMinDisplaySizeCustomLightingWidget)) -->

              <div class="entry empty reactiveColor"></div>
            <!-- /ko -->
          </div>
          <!-- /ko -->

          <!-- HISTORY FOR LEGACY BREATHE -->
          <!-- ko if: effectIsLegacyBreathe() -->
          <div class="history">
            <!-- ko foreach: historyEntries() -->
              <div class="entry legacyBreathe" data-bind="style: { background: legacyBreatheHistoryBackgroundString($data) }, click: $parentContext.applyLegacyBreatheDataObject, visible: ($index() < currentEffect().historyMaxDisplaySizeCustomLightingWidget)"></div>
            <!-- /ko -->

            <!-- EMPTY FILLER HISTORY ENTRIES -->
            <!-- ko foreach: (new Array(currentEffect().historyMinDisplaySizeCustomLightingWidget)).slice(0, currentEffect().historyMinDisplaySizeCustomLightingWidget - Math.min(historyEntries().length, currentEffect().historyMinDisplaySizeCustomLightingWidget)) -->

              <div class="entry empty legacyBreathe"></div>
            <!-- /ko -->
          </div>
          <!-- /ko -->
        </div>

        <hr class="historyPresetSeparator" data-bind="if: dialogVisible(), visible: (effectIsColorshift() || effectIsBreathe() || effectIsLegacyBreathe())">

        <div class="presetsContainer" data-bind="if: dialogVisible(), visible: (effectIsColorshift() || effectIsBreathe() || effectIsSteady() || effectIsLegacyBreathe() || effectIsAudioTrigger() || effectIsMsiBuiltin()), css: { steadyPresets: effectIsSteady() || effectIsMsiBuiltin(), colorShiftPresets: effectIsColorshift(), breathePresets: effectIsBreathe(), legacyBreathePresets: effectIsLegacyBreathe(), audioTriggerPresets: effectIsAudioTrigger()}">
          <!-- PRESETS FOR STEADY COLOR -->
          <div class="presets" data-bind="visible: effectIsSteady() || effectIsMsiBuiltin()">
            <div class="title" data-bind="localizedText: 'presets.presets'"></div>
            <div class="presetContainer" data-bind="foreach: steadyColorPresets">
              <div class="presetEntry steadyColor" data-bind="style: { background: steadyBackgroundString($data) }, click: $parentContext.applySteadyDataObject"></div>
            </div>
          </div>

          <!-- PRESETS FOR COLORSHIFT -->
          <div class="presets" data-bind="visible: effectIsColorshift()">
            <div class="title" data-bind="localizedText: 'presets.presets'"></div>
            <div class="presetContainer" data-bind="foreach: colorshiftPresets">
              <div class="presetEntry colorShift" data-bind="style: { background: colorShiftGradientString($data) }, click: $parentContext.applyColorshiftDataObject"></div>
            </div>
          </div>

          <!-- PRESETS FOR BREATHE -->
          <div class="presets" data-bind="visible: effectIsBreathe()">
            <div class="title" data-bind="localizedText: 'presets.presets'"></div>
            <div class="presetContainer" data-bind="foreach: breathePresets">
              <div class="presetEntry colorShift" data-bind="style: { background: breatheGradientString($data) }, click: $parentContext.applyBreatheDataObject"></div>
            </div>
          </div>

          <!-- PRESETS FOR STEADY COLOR -->
          <div class="presets" data-bind="visible: effectIsLegacyBreathe()">
            <div class="title" data-bind="localizedText: 'presets.presets'"></div>
            <div class="presetContainer" data-bind="foreach: legacyBreathePresets">
              <div class="presetEntry legacyBreathe" data-bind="style: { background: legacyBreatheHistoryBackgroundString($data) }, click: $parentContext.applyLegacyBreatheDataObject"></div>
            </div>
          </div>

          <!-- PRESETS FOR AUDIO TRIGGER (COPY OF STEADY COLOR) -->
          <div class="presets" data-bind="visible: effectIsAudioTrigger()">
            <div class="title" data-bind="localizedText: 'presets.presets'"></div>
            <div class="presetContainer" data-bind="foreach: steadyColorPresets">
              <div class="presetEntry steadyColor" data-bind="style: { background: steadyBackgroundString($data) }, click: $parentContext.applySteadyDataObject"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="disablingOverlay" data-bind="visible: effectIsMsiBuiltinNotColorSelectable()"></div>

    </div>

  </div>

</div>



</script>

<script type="text/html" id="lightingCustomColorOnly">
  <div class="LightingCustomColorContainer" data-bind="lightingCustomColorOnly: { ...$data }">
    <div class="LightingCustomColor LightingCustomColorOnly" data-bind="visible: isVisible()">
      <div class="dialogContent steady">
        <div class="lightingCustomColorOnlyCol1">
          <div class="steadyColorPickerContainer">
            <div class="title" data-bind="localizedText: 'widgets.colorPicker.title'"></div>
            <div class="picker">
              <div class="colorPickerContainer" data-bind="
                template: {
                  name: 'colorPicker',

                <div class="colorPickerContainer" data-bind="
                  visible: $parentContext.reactiveStopInfo().index === $index(),

    <!-- DIRECTION of the selected effect -->

      <button class="LaR directionButton" data-bind="disable: dirLaR, css: {disabled: dirLaR }, click: selectedEffect().applyDirection.bind(null, 'LaR')"><div class="dirIcon"></div></button>
      <button class="Spanning directionButton" data-bind="disable: dirSpanning, css: {disabled:dirSpanning }, click: selectedEffect().applyDirection.bind(null, 'Spanning')"><div class="dirIcon"></div></button>

    <!-- TOOL SELECTION -->
