<script type="text/html" id="lighting_tools">
  <div id="LightingTools" data-bind="lighting_tools: { settings: settings }, css: { disabled: settings.disabled}">

    <!-- A z-indexed div is positioned over everything else if the tools should be disabled -->
    <div class="disabledWrapperDiv" data-bind="visible: disabled, localizedTitle: { key: disabledTooltipLocalizationKey() }"></div>

    <!-- ko ifnot: hideModeSection -->
    <!-- ACTIVE/SLEEP TABS -->
    <div class="modeSelection">
      <ul class="modeTabs">
        <li class="modeTab activeMode" data-bind="css: { modeTabActive: currentLayer() == active }, click: settings.setActiveLayer">
          <i class="icon iconSun"></i><span class="modeLabel" data-bind="localizedText: 'common.active'">Active</span>
        </li>
        <li class="modeTab idleMode" data-bind="css: { modeTabActive: currentLayer() == idle }, click: settings.setIdleLayer">
          <i class="icon iconMoon"></i><span class="modeLabel" data-bind="localizedText: 'common.idle'">Idle</span>
        </li>
      </ul>
    </div>

    <!-- IDLE MODE OPTIONS -->
    <div class="content contentIdleOptions" data-bind="visible: currentLayer() == idle">
      <div class="idleTime" data-bind="css: { disabled: settings.idleTime() == 0 }">
        <span class="idleTimeText" data-bind="localizedText: 'widgets.idleTime.setIdleIn'"></span>
        <input class="idleTimeInput" type="text" data-bind="textInput: idleTimeSecs, event: { blur: idleTimeBlur }, disable: settings.idleTime() == 0">
        <span class="secondsLabel" data-bind="localizedText: 'common.secondsNonAbbreviated'"></span>
      </div>
      <hr class="extend"></hr>
      <div class="toggleIdleMode">
        <input type="checkbox" id="toggleIdleModeCheckbox" data-bind="checked: disableIdleMode">
        <label for="toggleIdleModeCheckbox" data-bind="localizedText: 'widgets.idleTime.disableIdle'"></label>
      </div>
    </div>
    <!-- /ko -->

    <!-- ko ifnot: hideTools -->
      <!-- ko ifnot: usingToolsList -->
      <div class="content contentBox" data-bind="template: { name: 'zoneSelectionTools', data: { model: settings }}, visible: currentLayer() == active || settings.idleTime() != 0"></div>
      <!-- /ko -->
      <!-- ko if: usingToolsList -->
      <div class="content contentBox" data-bind="template: { name: 'zoneSelectionToolsList', data: { model: settings }}"></div>
      <!-- /ko -->
    <!-- /ko -->

    <!-- COLOR and EFFECT SELECTION -->
    <div class="effectOptions" data-bind="css:{ idleModeActive: currentLayer() == idle, advancedTools: settings.showAdvancedTools, dropdownOverflow: [effectTypes.disabled, effectTypes.steadyColor, effectTypes.mixed].includes(selectedEffect().type) }, visible: currentLayer() == active || settings.idleTime() != 0">

      <div class="content contentEffectOptions">

        <div class="widget colorAndEffects">
          <!-- COLOR SELECTION -->
          <div class="colorOrEffectDisplay">

            <!-- Steady color, the color display is also clickable to select the color -->
            <div class="steadyColor biggerLed" data-bind="template: {name: 'led', data: {led: { model: colorModel } } }, visible: selectedEffect().type == effectTypes.steadyColor, style: { backgroundColor: 'rgb(' + colorModel.color.red() + ',' + colorModel.color.green() + ',' + colorModel.color.blue() + ')' }"></div>

            <!-- Colorshift -->
            <div class="colorShift" data-bind="style: { background: colorShiftGradientPreviewString }, visible: selectedEffect().type == effectTypes.colorShift"></div>

            <!-- Breathe -->
            <div class="breathe" data-bind="style: { background: breatheGradientPreviewString }, visible: selectedEffect().type == effectTypes.breathe"></div>

            <!-- Reactive -->
            <div class="reactiveColorSwatch" data-bind="style: { background: 'linear-gradient(-45deg,rgb(' + idleColorModel.color.red() + ',' + idleColorModel.color.green() + ',' + idleColorModel.color.blue() + ') 49%, rgb(' + activeColorModel.color.red() + ',' + activeColorModel.color.green() + ',' + activeColorModel.color.blue() + ') 50%)', width: '100%', height: '100%' }, visible: selectedEffect().type == effectTypes.reactive"></div>

            <!-- Cooldown timer -->
            <div class="cooldownTimer" data-bind="style: { background: 'linear-gradient(-45deg,rgb(' + cooldownColorModel.color.red() + ',' + cooldownColorModel.color.green() + ',' + cooldownColorModel.color.blue() + ') 49%, rgb(' + readyColorModel.color.red() + ',' + readyColorModel.color.green() + ',' + readyColorModel.color.blue() + ') 50%)', width: '100%', height: '100%' }, visible: selectedEffect().type == effectTypes.cooldownTimer"></div>

            <!-- Mixed selection -->
            <div class="mixed" data-bind="visible: selectedEffect().type == effectTypes.mixed"></div>

            <!-- Disabled selection -->
            <div class="disabledLighting" data-bind="visible: selectedEffect().type == effectTypes.disabled"></div>

          </div>



          <!-- EFFECT -->
          <div class="effectSelection">

            <div class="effectDropdownLabel" data-bind="localizedText:'widgets.led.effectsLabel'">Effects</div>
            <div class="dropdownContainer effectDropdown" data-bind="dropdown: setEffectType">
              <a href="javascript:void(0)" class="dropdownButton withArrow" data-bind="localizedText: selectedEffect().localizationKey"></a>

              <div class="dropdownContent topGradient">
                <div class="scrollableArea">
                  <ul class="" data-bind="foreach: effects">
                    <li class="" data-bind="localizedText: localizationKey, visible: currentLayer() == active || !hideInIdle"></li>
                  </ul>
                </div>
              </div>
            </div><!-- dropdownContainer -->

          </div>

          <a href="javascript:void(0)" class="fancyCircularTooltip tooltipEffects nonAbsolute" data-bind="localizedTitle: selectedEffect().tooltipLocalizationKey, tooltip: { right: true }, css: {warningIcon: isCooldownTimerSelected}"></a>

        </div><!-- .colorAndEffects -->

        <!-- Spacer, necessary for types that are not followed by options -->
        <div class="colorAndEffectsEndSpacer" data-bind="visible: (selectedEffect().type == effectTypes.mixed || selectedEffect().type == effectTypes.disabled)"></div>

        <!-- EFFECT OPTIONS -->
        <div class="content contentEffects">
          <hr class="extend" data-bind="visible: (selectedEffect().type != effectTypes.steadyColor &amp;&amp; selectedEffect().type != effectTypes.mixed &amp;&amp; selectedEffect().type != effectTypes.disabled)"></hr>

          <!-- GRADIENT EDITOR for COLORSHIFT -->
          <div data-bind="template: {name: 'custom_gradient', data:{ colorObservables: colorshiftColorObservables, positionObservables: colorshiftPositionObservables, maxStops: colorshiftMaxStops, effectType: effectTypes.colorShift, forceResetObservable: colorshiftForceResetStops, forceUpdateObservable: colorshiftForceUpdateStops, numStopsObservable: colorshiftNumColorsObservable }}, visible: selectedEffect().type == effectTypes.colorShift"></div>

          <!-- GRADIENT EDITOR for BREATHE -->
          <div data-bind="template: {name: 'custom_gradient', data:{ colorObservables: breatheColorObservables, positionObservables: breathePositionObservables, maxStops: breatheMaxStops, effectType: effectTypes.breathe, forceResetObservable: breatheForceResetStops, forceUpdateObservable: breatheForceUpdateStops, numStopsObservable: breatheNumColorsObservable }}, visible: selectedEffect().type == effectTypes.breathe"></div>

          <!-- SPEED SLIDER FOR COLORSHIFT -->
          <div class="sliderInlineLabels" data-bind="visible: selectedEffect().type == effectTypes.colorShift">
            <hr class="extend"></hr>
            <div class="sliderTitle" data-bind="localizedText: 'common.speed'"></div>
            <div data-bind="template: {name: 'horizSlider', data: {options: effectSpeedValues, displayTicks: 2, displayOptions: effectSpeedDisplayValues, suffix: 's', value: colorshiftSpeed, noSnapToTicks: true, whichDisplayOptionObservable: 'first' } }"></div>
          </div>

          <!-- SPEED SLIDER FOR BREATHE -->
          <div class="sliderInlineLabels" data-bind="visible: selectedEffect().type == effectTypes.breathe">
            <hr class="extend"></hr>
            <div class="sliderTitle" data-bind="localizedText: 'common.speed'"></div>
            <div data-bind="template: {name: 'horizSlider', data: {options: effectSpeedValues, displayTicks: 2, displayOptions: effectSpeedDisplayValues, suffix: 's', value: breatheSpeed, noSnapToTicks: true, whichDisplayOptionObservable: 'first' } }"></div>
          </div>

          <!-- WAVE MODE FOR COLORSHIFT -->
          <div class="waveMode" data-bind="visible: selectedEffect().type == effectTypes.colorShift">
            <hr class="extend"></hr>
            <div>
              <input type="checkbox" id="colorshiftWaveModeCheckbox" data-bind="checked: colorshiftIsDirectional"/>
              <label class="colorshiftWaveModeCheckboxLabel" for="colorshiftWaveModeCheckbox" data-bind="localizedText: 'widgets.waveMode.title'"></label>
            </div>
            <div class="waveModeSubOptions" data-bind="css: {disabled:!colorshiftIsDirectional()}">
              <!-- ko if: allowSetOrigin -->
              <div data-bind="template: {name: 'wavemode_origin', data: { colorshiftOriginX: colorshiftOriginX, colorshiftOriginY: colorshiftOriginY, colorObservables: colorshiftColorObservables, positionObservables: colorshiftPositionObservables, numStopsObservable: colorshiftNumColorsObservable, disabled: !colorshiftIsDirectional(), deviceWidth: settings.deviceWidth, deviceHeight: settings.deviceHeight, colorshiftDirectionType: colorshiftDirectionType, selectedEffect: selectedEffect, changeTool: settings.changeTool, currentTool: settings.currentTool, effectTypes: effectTypes, isIdleMode: currentLayer() == idle, toolsExpanded: settings.showAdvancedTools() } }"></div>
              <!-- /ko -->

              <div class="waveModeButtons">
                <button class="waveModeSmallButton radial" data-bind="css: {'active':colorshiftIsRadial()}, click: setColorshiftDirectionRadial">
                  <i class="icon radialIcon"></i>
                </button>
                <button class="waveModeSmallButton horizontal" data-bind="css: {'active':colorshiftIsHorizontal()}, click: setColorshiftDirectionHorizontal">
                  <i class="icon horizontalIcon"></i>
                </button>
                <button class="waveModeSmallButton vertical" data-bind="css: {'active':colorshiftIsVertical()}, click: setColorshiftDirectionVertical">
                  <i class="icon verticalIcon"></i>
                </button>
                <button class="waveModeSmallButton out" data-bind="css: {'active':colorshiftIsInverted()}, click:setColorshiftInverted">
                  <i class="icon outwardIcon"></i>
                </button>
                <button class="waveModeSmallButton in" data-bind="css: {'active':!colorshiftIsInverted()}, click:setColorshiftNonInverted">
                  <i class="icon inwardIcon"></i>
                </button>
              </div>
              <div class="sliderInlineLabels waveScale">
                <div data-bind="template: {name: 'horizSlider', data: {options: effectScaleValues, displayTicks: 2, value: colorshiftScale, noSnapToTicks: true}, enable:colorshiftIsDirectional }"></div>
              </div>
            </div>
          </div>

          <!-- COLOR EDITOR for REACTIVE -->
          <div class="reactiveColorSelection" data-bind="visible: selectedEffect().type == effectTypes.reactive">
            <div class="colorOption colorOptionActive">
              <div class="color" data-bind="template: {name: 'led', data: {led: { model: activeColorModel } } }"></div>

              <span class="colorOptionLabel" data-bind="localizedText: 'widgets.led.effects.reactiveColor.activeColor'"></span>
            </div>

            <div class="colorOption colorOptionIdle">
              <div class="color" data-bind="template: {name: 'led', data: {led: { model: idleColorModel } } }"></div>

              <span class="colorOptionLabel" data-bind="localizedText: 'widgets.led.effects.reactiveColor.restColor'"></span>
            </div>

            <hr class="extend"></hr>

            <div class="sliderInlineLabels">
              <div class="sliderTitle title" data-bind="localizedText: 'common.speed'">Speed</div>
              <div data-bind="template: {name: 'horizSlider', data: {options: reactiveTimeValues, displayTicks: 9, displayOptions: reactiveTimeDisplayValues, suffix: 's', value: reactiveTime, noSnapToTicks: true } }"></div>
            </div>

          </div>

          <!-- EDITOR for COOLDOWN TIMER -->
          <div class="cooldownTimerEditor" data-bind="visible: selectedEffect().type == effectTypes.cooldownTimer">
            <div class="colorOption colorOptionReady">
              <div class="color" data-bind="template: {name: 'led', data: {led: { model: readyColorModel } } }"></div>

              <span class="colorOptionLabel" data-bind="localizedText: 'widgets.softwareEffects.cooldownTimer.readyColor'"></span>
            </div>

            <div class="colorOption colorOptionCooldown">
              <div class="color" data-bind="template: {name: 'led', data: {led: { model: cooldownColorModel } } }"></div>

              <span class="colorOptionLabel" data-bind="localizedText: 'widgets.softwareEffects.cooldownTimer.cooldownColor'"></span>
            </div>

            <hr class="extend"></hr>
            <div class="cooldownTimerInput">
              <label class="cooldownTimerTimerLabel" data-bind="localizedText: { key: 'common.timer', suffix: ':'}"></label>
              <input type="text" class="cooldownTimerTimeInput" data-bind="value: cooldownTimerTimeMsComputed, valueUpdate: 'input'"></input>
              <label class="cooldownTimerTimeInputLabel" data-bind="localizedText: 'common.milliseconds'"></label>
            </div>
            <div class="cooldownTimerInput">
              <label class="cooldownTimerTriggerInputLabel" data-bind="localizedText: { key: 'common.trigger', suffix: ':'}"></label>
              <input type="text" class="cooldownTimerTriggerInput" data-bind="value: cooldownTimerTriggerCodeDisplayText, hasFocus: currentlyRecordingCooldownTimerTriggerFocusComputed, css: {italic: isRecordingCooldownTimerTriggerCode(), shouldDisplayWarning: cooldownTimerTriggerCode() == 0}, event: { keydown: preventTab }"></input>
              <button class="removeCooldownTimerTriggerCodeButton" data-bind="click: removeCooldownTimerTriggerCode, css: { disabled: !cooldownTimerTriggerCode() }"></button>
            </div>
            <div class="directionInput">
              <label class="directionLabel" data-bind="localizedText: {key: 'widgets.softwareEffects.cooldownTimer.startOnKey', suffix: ':'}"></label>
              <div class="directionContainer">
                <div class="directionToggle" data-bind="toggle: { field: cooldownTimerDirection, numerical: [0,1]}, css: {up: cooldownTimerDirection() == 0, down: cooldownTimerDirection() == 1}">
                  <div class="directionArrow"></div>
                </div>
              </div>
            </div>
          </div>

        </div><!-- -->

        <!-- HISTORY -->
        <div class="content contentHistory widget" data-bind="visible: selectedEffect().type != effectTypes.disabled &amp;&amp; selectedEffect().type != effectTypes.mixed">
          <hr class="extend"></hr>
          <div class="title" data-bind="localizedText: 'common.history'"></div>
          <div class="history" data-bind="css: { effect: selectedEffect().type == effectTypes.colorShift || selectedEffect().type == effectTypes.breathe }">
            <!-- ko if: selectedEffect().type == effectTypes.steadyColor -->
              <!-- ko foreach: historyEntries -->
                <div class="entry steadyColor" data-bind="style: { background: steadyBackgroundString($data)}, click: computedDataObject, visible: ($index() < selectedEffect().historyDisplaySizeLightingTools)"></div>
              <!-- /ko -->
            <!-- /ko -->

            <!-- ko if: selectedEffect().type == effectTypes.colorShift -->
              <!-- ko foreach: historyEntries -->
                <div class="entry colorShift" data-bind="style: { backgroundImage: colorShiftGradientString($data) }, click: computedEffectDataObject, visible: ($index() < selectedEffect().historyDisplaySizeLightingTools)"></div>
              <!-- /ko -->
            <!-- /ko -->

            <!-- ko if: selectedEffect().type == effectTypes.breathe -->
              <!-- ko foreach: historyEntries -->
                <div class="entry breathe" data-bind="style: { backgroundImage: breatheGradientString($data) }, click: computedEffectDataObject, visible: ($index() < selectedEffect().historyDisplaySizeLightingTools)"></div>
              <!-- /ko -->
            <!-- /ko -->

            <!-- ko if: selectedEffect().type == effectTypes.reactive -->
              <!-- ko foreach: historyEntries -->
                <div class="entry reactiveColor" data-bind="style: { background: reactiveBackgroundString($data) }, click: computedDataObject, visible: ($index <= selectedEffect().historyDisplaySizeLightingTools), visible: ($index() < selectedEffect().historyDisplaySizeLightingTools)"></div>
              <!-- /ko -->
            <!-- /ko -->

            <!-- ko if: selectedEffect().type == effectTypes.cooldownTimer -->
              <!-- ko foreach: historyEntries -->
                <div class="entry cooldownTimer" data-bind="style: { background: cooldownGradientString($data) }, click: computedDataObject, visible: ($index() < selectedEffect().historyDisplaySizeLightingTools)"></div>
              <!-- /ko -->
            <!-- /ko -->

            <!-- Empty filler boxes -->
            <!-- ko foreach: (new Array(selectedEffect().historyDisplaySizeLightingTools)).slice(0, selectedEffect().historyDisplaySizeLightingTools - Math.min(historyEntries().length, selectedEffect().historyDisplaySizeLightingTools)) -->

            <!-- ko if: selectedEffect().type == effectTypes.steadyColor -->
            <div class="entry empty steadyColor"></div>
            <!-- /ko -->

            <!-- ko if: selectedEffect().type == effectTypes.colorShift -->
            <div class="entry empty colorShift" data-bind="css:{ 'hidden': $index() + 3 - selectedEffect().historySize &lt; 0 }, visible: $index() + 3 - selectedEffect().historySize &gt;= 0"></div>
            <!-- /ko -->

            <!-- ko if: selectedEffect().type == effectTypes.breathe -->
            <div class="entry empty breathe" data-bind="css:{ 'hidden': $index() + 3 - selectedEffect().historySize &lt; 0 }, visible: $index() + 3 - selectedEffect().historySize &gt;= 0"></div>
            <!-- /ko -->

            <!-- ko if: selectedEffect().type == effectTypes.reactive -->
            <div class="entry empty reactiveColor"></div>
            <!-- /ko -->

            <!-- ko if: selectedEffect().type == effectTypes.cooldownTimer -->
            <div class="entry empty cooldownTimer"></div>
            <!-- /ko -->

            <!-- /ko -->
          </div>

        </div>

        <!-- PRESETS -->
        <div class="content contentHistory widget" data-bind="visible: (selectedEffect().type == effectTypes.colorShift &amp;&amp; colorShiftPresets.length) || (selectedEffect().type == effectTypes.breathe &amp;&amp; breathePresets.length)">
          <hr class="extend"></hr>
          <div class="title" data-bind="localizedText: 'presets.presets'"></div>

          <div class="history effect effectLast" data-bind="visible: selectedEffect().type == effectTypes.colorShift, foreach: colorShiftPresets">
            <div class="entry colorShift" data-bind="style: { backgroundImage: colorShiftGradientString($data) }, click: computedEffectDataObject"></div>
          </div>

          <div class="history effect effectLast" data-bind="visible: selectedEffect().type == effectTypes.breathe, foreach: breathePresets">
            <div class="entry breathe" data-bind="style: { backgroundImage: breatheGradientString($data) }, click: computedEffectDataObject"></div>
          </div>

        </div>

      </div><!-- .effectOptions -->

    </div>

  </div>
</script>

<script type="text/html" id="mappings">
  <!-- TRIGGER MAPPING WIDGET -->
  <div id="MappingsWidgetFilterDropdown" class="widget mappingsWidget" data-bind="css: { hidden: $root.device.actionFilters().length < 2 }">
    <div class="dropdownContainer" data-bind="dropdown: $root.device.selectFilter">
      <a href="javascript:void(0)" class="deviceConfigBtn dropdownButton withArrow" data-bind="localizedText: $root.device.selectedFilter().localeKey"></a>

      <div class="dropdownContent actionFilterDropdown topGradient">
        <div class="scrollableArea">
          <ul class="actionFilters" data-bind="foreach: $root.device.actionFilters">
            <li class="actionFilter" data-bind="localizedText: localeKey"></li>
          </ul>
        </div>
      </div>
    </div> <!-- dropdownContainer -->
  </div>


  <div id="MappingsWidget" class="widget mappingsWidget" data-bind="mapping: { bindings: bindings, selectBinding: selectBinding, quicksetDialog: quicksetDialog, orientationModel: orientationModel, bindingsSort: $data.bindingsSort, steadyColorPresets: $data.steadyColorPresets }">

    <div class="groupContent" data-bind="css: { shadedBackground: bindingGroups().length <= 1 }">
      <ul class="groupList" data-bind="foreach: bindingGroups">
        <li class="group" data-bind="css: { hiddenByFilter: !filterVisible(), shadedBackground: $parentContext.bindingGroups().length > 1 }">
          <div class="title" data-bind="localizedText: localeKey"></div>
          <a href="javascript:void(0)" class="tooltip" data-bind="localizedTitle: tooltipLocaleKey, tooltip: {}"></a>

          <div class="content">
            <ul class="mapList" data-bind="foreach: bindings">
              <li data-bind="css: {hiddenTrigger: trigger.triggerVisible == false, hiddenByFilter: filterVisible() == false}, hidden: $data.hidden">
                <span class="buttonName" data-bind="text: trigger.name"></span>
                <a href="javascript:void(0)" class="action" data-bind="text: action().name, click: $parents[1].selectBinding, attr: {'data-hotspot': trigger.hotspot}, css: associatedClasses, event: {mouseover: addUserHover, mouseout: removeUserHover}"></a>
                <div data-bind="if: selected()">
                  <div data-bind="template: {name: $root.device.useWideQuicksetDialog ? 'WideQuicksetDialogTemplate' : 'QuicksetDialogTemplate', data: {widgetData: $parents[1].quicksetDialog}}"></div>
                </div>
              </li>
            </ul>
          </div>
        </li>
      </ul>
    </div>

    <!-- BUTTON MARKER LABELS -->
    <section class="buttonMarkers">
      <ul class="markers" data-bind="foreach: bindings, css: orientationModel.view">
        <!--ko if: trigger.hotspot -->
        <li class="marker" data-bind="class: trigger.hotspot + ' ' + associatedClasses(), attr: {'data-hotspot': trigger.hotspot}, css: { hidden: $data.hidden }">
          <a href="javascript:void(0)" data-bind="click: $parent.selectBinding, text: trigger.label || trigger.hotspot, event: {mouseover: addUserHover, mouseout: removeUserHover}"></a>
          <div class="helperBlock"></div>
          <!-- ko if: trigger.LEDModel -->
          <div data-bind="template: {name: 'led', data: {led: { model: trigger.LEDModel } } }, css: trigger.LEDModel.templateClass">
          </div>
          <!--/ko-->
          <!-- ko if: trigger.lightingCustomModel -->
          <div data-bind="template:{ name: 'lightingCustom', data:{
            lightingCustomModel: { lighting: trigger.lightingCustomModel, steadyPresets: steadyColorPresets } } }, css: trigger.lightingCustomModel.templateCssClass">
            </div>
          <!--/ko-->

          <!-- TOOLTIPS -->
          <div class="actionTooltip">
            <a class="action" data-bind="css: associatedClasses">
              <span class="actionName" data-bind="text: action().name"></span>
            </a>
          </div>

          <!-- CUSTOM BINDING INDICATOR -->
          <i class="customBindingIndicator"></i>

          <!-- RAPID TRIGGER ICON -->
          <!-- NOTE: keep these in stacking order for proper display -->
          <!-- ko if: $parent.showProtectionModeIcons -->
            <i class="protectionModeIcon" data-bind="visible: $parent.protectionModeKeys().includes(trigger.code)"></i>
          <!-- /ko -->
          <!-- ko if: $parent.showRapidTriggerIcons -->
            <i class="rapidTriggerIcon" data-bind="visible: $parent.rapidTriggerKeys().includes(trigger.code), css: { hasSecondActuationBinding: $parent.dualActuationKeys().includes(trigger.code) }"></i>
          <!-- /ko -->
        </li>
        <!--/ko-->
      </ul>
    </section>
  </div>

  <!-- MACRO EDITOR BUTTON -->
  <div id="MacroButton" class="widget mappingsWidget shadedBackground">
    <div class="group">
      <div class="content">
        <ul class="mapList" id="MacroEditorContainer">
          <li>
            <span class="buttonName" data-bind="localizedText: 'macroEditor.windowTitle'"></span>
            <button class="action" data-bind="click: openMacroEditor.bind(null,{}), localizedText: 'main.launch'"></button>
          </li>
        </ul>
      </div>
    </div>
  </div>
</script>

<script type="text/html" id="screen-editor">
  <div class="screen-editor" data-bind="screenEditor: $data">
    <div class="screen-editor__content">
      <div class="screen-editor__upload-section">
        <button class="screen-editor__button screen-editor__button--upload positive" data-bind="click: selectFile, localizedText: 'widgets.screenEditor.uploadFromFile'"></button>
        <!-- ko if: isAnimationAllowed -->
        <span class="screen-editor__upload-instructions" data-bind="localizedText: { key: 'widgets.lcd.bestResultsWithAnimation', '#WIDTH#': screenWidth, '#HEIGHT#': screenHeight }"></span>
        <!-- /ko -->
        <!-- ko if: !isAnimationAllowed -->
        <span class="screen-editor__upload-instructions" data-bind="localizedText: { key: 'widgets.lcd.bestResults', '#WIDTH#': screenWidth, '#HEIGHT#': screenHeight }"></span>
        <!-- /ko -->        
      </div>

      <!-- ko if: shouldShowErrorMessage() -->
      <span class="screen-editor__error-message" data-bind="text: errorMessage()"></span>
      <!-- /ko -->

      <div class="screen-editor__editor-section">
        <div class="screen-editor__editor-header">
          <span class="screen-editor__editing-instructions" data-bind="localizedText: 'widgets.screenEditor.editYourImage'"></span>
          <button class="screen-editor__button screen-editor__button--grid-toggle negative" data-bind="click: toggleGrid, localizedText: 'widgets.screenEditor.toggleGrid'"></button>
        </div>

        <svg class="screen-editor__grid" data-bind="visible: isGridVisible">
          <defs>
            <pattern id="square" width="4" height="4" patternUnits="userSpaceOnUse">
              <path d="M 4 0 L 0 0 0 4" fill="none" stroke="gray" stroke-width="0.5"/>
            </pattern>
          </defs>
          <rect width="100%" height="100%" fill="url(#square)" />
        </svg>

        <canvas class="screen-editor__canvas" data-bind="
          screenEditorPreview: $data,
          screenEditorDrawing: $data,
          css: {
            animated: isScreenAnimated,
            loading: isUploadInProgress,
            dithering: isDitheringInProgress
          }
        "></canvas>

        <!-- ko ifnot: isUploadInProgress() || isDitheringInProgress() -->
        <div class="screen-editor__tools screen-editor__tools--default">
          <div class="screen-editor__button-container screen-editor__button-container--drawing">
            <span class="screen-editor__drawing-color" data-bind="localizedText: { key: 'widgets.screenEditor.pencilColor', suffix: ':' }"></span>
            <button class="screen-editor__button screen-editor__button--circle screen-editor__button--draw-white" data-bind="click: setDrawColorToWhite, disable: isScreenAnimated, css: { active: isDrawColorWhite, disabled: isScreenAnimated }"></button>
            <button class="screen-editor__button screen-editor__button--circle screen-editor__button--draw-black" data-bind="click: setDrawColorToBlack, disable: isScreenAnimated, css: { active: isDrawColorBlack, disabled: isScreenAnimated }"></button>
          </div>
          <div class="screen-editor__button-container screen-editor__button-container--editing">
            <button class="screen-editor__button screen-editor__button--transparent screen-editor__button--invert negative" data-bind="click: onInvertButtonClick, localizedText: 'widgets.lcd.invert'"></button>
            <div class="screen-editor__button-separator"></div>
            <button class="screen-editor__button screen-editor__button--transparent screen-editor__button--clear negative" data-bind="click: onClearButtonClick, localizedText: 'common.clear'"></button>
            <div class="screen-editor__button-separator"></div>
            <button class="screen-editor__button screen-editor__button--transparent screen-editor__button--undo negative" data-bind="click: undo, disable: !isUndoAllowed(), localizedText: 'osActions.action.undo'"></button>
          </div>
        </div>
        <!-- /ko -->

        <!-- ko if: isDitheringInProgress() -->
        <div class="screen-editor__tools screen-editor__tools--dither">

      <button class="positive" data-bind="click: addNewTimer, localizedText: 'widgets.tactileCooldowns.makeATimer'"></button>
    </div>
    <ul class="commands" data-bind="foreach: cooldowns, visible: cooldowns().length &gt; 1 || editingCooldown() !== null, css: { editing: editingCooldown() !== null }">
      <li class="command" data-bind="css: { disabled: editingCooldown() !== null &amp;&amp; editingCooldown() !== $data }">
        <!-- ko if: $data == editingCooldown() -->
          <div class="editing">
            <div class="editingHeader" data-bind="localizedText: { key: 'widgets.tactileCooldowns.timerNum', '#NUMBER#': $index() + 1 }"></div>
            <div class="field">
              <label data-bind="localizedText: { key: 'widgets.led.effects.nonAudioTrigger', suffix: ':' }"></label>
              <input type="text" class="cooldownTimerTriggerInput" data-bind="value: $parentContext.keyText, css: { blank: $parentContext.editingKey() === null &amp;&amp; !$parentContext.isRecording(), recording: $parentContext.isRecording }, event: { mousedown: $parentContext.startRecordingFocus, keypress: function(){ return false; } }"></input>
            </div>
            <hr />
            <div class="field">
              <label data-bind="localizedText: { key: 'widgets.tactileCooldowns.duration', suffix: ':' }"></label>
              <input type="number" class="cooldownTimerDurationInput" data-bind="value: $parentContext.editingTime"></input>
              <label data-bind="localizedText: 'common.milliseconds'"></label>
            </div>
            <hr />
            <div class="field">
              <label data-bind="localizedText: 'widgets.quickset.vibration'"></label>
            </div>
            <div class="field">
              <div class="dropdownContainer vibrationsDropdown" data-bind="dropdown: $parentContext.editVibrationAndPreview, dropdownFlippable: true">
                <a href="javascript:void(0)" class="dropdownButton withArrow" data-bind="localizedText: $parentContext.vibrationsModel.vibrationToLocalizationKey($parentContext.editingVibration())"></a>

                  <div class="scrollableArea">
                    <ul class="actionTypes" data-bind="foreach: $parentContext.vibrationsModel.vibrations">
                      <li class="" data-bind="localizedText: $parentContext.vibrationsModel.vibrationToLocalizationKey($data)"></li>
                    </ul>
                  </div>
                </div>
              </div>
            </div>
            <hr />
            <div class="field">
              <label data-bind="localizedText: 'widgets.softwareEffects.cooldownTimer.startOnKey'"></label>
              <div class="directionContainer">
                <div class="directionToggle" data-bind="toggle: { field: editingDirection, numerical: [0,1]}, css: {up: editingDirection() == 0, down: editingDirection() == 1}">
                  <div class="directionArrow"></div>
                </div>
              </div>
            </div>
            <hr />
            <div class="field">
              <input type="checkbox" id="TriggerResetsCooldownCheckbox" data-bind="checked: $parentContext.editingAllowReset"/>
              <label for="TriggerResetsCooldownCheckbox" data-bind="localizedText: 'widgets.tactileCooldowns.triggerResetsCooldown'"></label>
              <a href="javascript:void(0)" class="fancyCircularTooltip nonAbsolute resetCooldownTooltip" data-bind="localizedTitle: 'widgets.tactileCooldowns.triggerResetsCooldownTooltip', tooltip: {}"></a>
            </div>
            <hr />
            <div class="buttons">
              <button class="negative" data-bind="click: $parentContext.cancelEditing, localizedText: 'common.cancel'"></button>
              <button class="positive" data-bind="click: $parentContext.saveEditing, localizedText: 'common.done', disable: editingKey() === null"></button>
            </div>
          </div>
        <!-- /ko -->
        <!-- ko ifnot: $data == editingCooldown() -->
          <!-- ko if: $data.blank -->
            <div class="addNew" data-bind="click: $parentContext.editCooldown">
              <i class="icon iconPlus mediumGrey"></i>
              <div class="addNewLabel" data-bind="localizedText: 'widgets.tactileCooldowns.addTimer'"></div>
            </div>
          <!-- /ko -->
          <!-- ko ifnot: $data.blank -->
            <div class="preview">
              <div class="previewText" data-bind="text: $parentContext.previewLabel($data)"></div>
              <button class="trash" data-bind="click: $parentContext.deleteCooldown"><i class="icon iconTrash lightGrey"></i></button>
              <button class="edit" data-bind="click: $parentContext.editCooldown"><i class="icon iconPencil lightGrey"></i></button>
            </div>
          <!-- /ko -->
        <!-- /ko -->
      </li>
    </ul>
  </div>
</div>

</script>

<script type="text/html" id="zoneColors">

        <div class="zoneTooltip" data-bind="visible: showEmblem($data)">
          <i class="icon" data-bind="css: tooltipCss($data)"></i>
          <span data-bind="text: tooltipText($data)"></span>
        </div>
        <div class="bgShape" data-bind="style: { backgroundColor: backgroundColor($data, false, false), boxShadow: boxShadowColor($data, false, false) }"></div>
        <div class="highlightColor" data-bind="style: { backgroundColor: backgroundColor($data, false, true) }"></div>
        <div class="keyBorder" data-bind="style: { borderColor: backgroundColor($data) }"></div>
        <!-- ko if: withZoneGuides -->
        <div class="guide" data-bind="css: { on: zoneGuidesOn }"></div>
        <!-- /ko -->
        <div class="emblem" data-bind="visible: showEmblem($data)">
          <!-- ko if: isLocked($data) -->
          <div class="lock"></div>
          <!-- /ko -->
          <!-- ko ifnot: isLocked($data) -->
          <div class="diamond" data-bind="style: { backgroundColor: backgroundColor($data, true, false) }"></div>
          <!-- /ko -->
        </div>
        <!-- ko if: withZoneLabels -->
        <div class="marker" data-bind="attr:{ 'data-code': hid }">
          <span data-bind="localizedText: { key: 'widgets.zoneColors.zone', '#ZONENUMBER#': hid + 1 } , attr: { 'data-code': hid }"></span>
        </div>
        <!-- /ko -->
      </li>
      <!-- /ko -->
    </ul>

    <!-- ko if: withZoneGroups -->
    <div class="labeled-button-container labeled-button-container--top illumination-editing-mode">
      <span class="label" data-bind="localizedText: 'widgets.zoneColors.mode'"></span>
      <div class="button-container button-container--horizontal button-container--rounded-button-combine">
        <button class="button-highlighted-background" data-bind="click: setEditingMode, css: { active: editingMode() === editingModes().group }, attr: { 'data-mode': editingModes().group }, localizedText: { key: 'widgets.zoneColors.group', '#GROUPNUMBER#': '' }"></button>
        <button class="button-highlighted-background" data-bind="click: setEditingMode, css: { active: editingMode() === editingModes().zone }, attr: { 'data-mode': editingModes().zone }, localizedText: { key: 'widgets.zoneColors.zone', '#ZONENUMBER#': '' }"></button>
      </div>
    </div>

    <ul class="colorGroups" data-bind="foreach: { data: groups, afterRender: recacheGroupNodes }, css: view(), { brushTypeToolSelected: brushTypeToolSelected, brushTypeToolClicked: brushTypeToolClicked, selectTypeToolSelected: selectTypeToolSelected, selectTypeToolClicked: selectTypeToolClicked }, visible: editingMode() === editingModes().group">
      <li class="group" data-bind="event: { click: zoneClick, mouseenter: zoneEnter, mouseleave: zoneLeave, mousedown: zoneDown }, css: css($index()), attr: { 'data-code': $index() }">
        <span class="title" data-bind="localizedText: { key: 'widgets.zoneColors.group', '#GROUPNUMBER#': $index() + 1 }"></span>
        <div class="bgShape" data-bind="style: { backgroundColor: backgroundColor($data) }"></div>
        <div class="highlightColor" data-bind="style: { backgroundColor: backgroundColor($data, false, true) }"></div>
        <div class="keyBorder"></div>
      </li>
    </ul>
    <!-- /ko -->

    <!-- ko if: withZoneGuides -->
    <div class="zoneGuideToggle" data-bind="visible: editingMode() === editingModes().zone">
      <div class="toggleButton largeToggleButton" data-bind="toggle: { field: zoneGuidesOn }, css: { on: zoneGuidesOn }">
        <label class="labelButton" data-bind="css: { on: zoneGuidesOn }"></label>
        <div class="transitionalBefore"></div>
        <label class="before"></label>
        <div class="transitionalAfter"></div>
        <label class="after"></label>
      </div>
      <span data-bind="localizedText: 'widgets.zoneColors.showZoneGuides'"></span>
    </div>
    <!-- /ko -->
    <!-- /ko -->

  </div>
</script>

            <!-- Steady color, different from previous in that it allows randomization -->
            <div class="steadyColor randomizableSteadyColor biggerLed" data-bind="template: {name: 'led', data: {led: { model: randomizableSteadyColorModel } } }, visible: selectedEffect().type == effectTypes.randomizableSteadyColor"></div>

            <!-- Disabled -->

          </div> <!-- colorOrEffectDisplay -->

          <!-- EFFECT SELECTION -->

            <div class="dropdownContainer effectDropdown" data-bind="dropdown: setEffect">

            </div><!-- dropdownContainer -->

          </div> <!-- effectSelection -->

          <a href="javascript:void(0)" class="fancyCircularTooltip tooltipEffects nonAbsolute" data-bind="localizedTitle: selectedEffect().tooltipLocalizationKey, tooltip: { right: true }"></a>

        </div> <!-- colorAndEffects -->

        <!-- HISTORY -->
        <div class="content contentHistory widget" data-bind="visible: selectedEffect().type != effectTypes.disabled">
          <hr class="extend"></hr>
          <div class="title" data-bind="localizedText: 'common.history'"></div>
          <div class="history" data-bind="css: { effect: selectedEffect().type == effectTypes.colorShift || selectedEffect().type == effectTypes.breathe }">
            <!-- ko if: selectedEffect().type == effectTypes.steadyColor -->
              <!-- ko foreach: historyEntries -->
                <div class="entry steadyColor" data-bind="style: { background: steadyBackgroundString($data)}, click: computedDataObject, visible: ($index() < selectedEffect().historyDisplaySizeLightingTools)"></div>
              <!-- /ko -->
            <!-- /ko -->

            <!-- ko if: selectedEffect().type == effectTypes.randomizableSteadyColor -->
              <!-- ko foreach: historyEntries -->
                <div class="entry steadyColor" data-bind="style: { background: steadyBackgroundString($data)}, click: computedDataObject, visible: ($index() < selectedEffect().historyDisplaySizeLightingTools), css: { randomized: isColorRandomized($data)}"></div>
              <!-- /ko -->
            <!-- /ko -->

            <!-- Empty filler boxes -->
            <!-- ko foreach: (new Array(selectedEffect().historyDisplaySizeLightingTools)).slice(0, selectedEffect().historyDisplaySizeLightingTools - Math.min(historyEntries().length, selectedEffect().historyDisplaySizeLightingTools)) -->

            <!-- ko if: selectedEffect().type == effectTypes.steadyColor || selectedEffect().type == effectTypes.randomizableSteadyColor -->
            <div class="entry empty steadyColor"></div>
            <!-- /ko -->

            <!-- /ko -->
          </div>

        </div>

      </div>
    </div>

  </div>
</script>

<script type="text/html" id="mouseRotation">
    <a href="javascript:void(0)" class="tooltip" data-bind="localizedTitle: 'widgets.mouseRotation.tooltip', tooltip: {}"></a>
    <div class="content">
        <div class="switchWidget">
            <div class="modeToggle">
              <div class="toggleButton" data-bind="toggle: {field: rotationEnabled, numerical: [1,0]}">
                <label class="labelButton" data-bind="css: {on: rotationEnabled()}"></label>
                <label class="before" data-bind="localizedText: 'common.on'"></label>
                <label class="after" data-bind="localizedText: 'common.off'"></label>
              </div>
            </div>
            <label class="toggleLabel" data-bind="localizedText: 'widgets.mouseRotation.title'"></label>
        </div>
        <label class="description" data-bind="localizedText: 'widgets.mouseRotation.description'"></label>
        <div class="container" data-bind="css:{disabled: !rotationEnabled()}">
          <div data-bind="mouseRotation: $data" style="display: contents;"></div>
          <div class="sliderWidget" data-bind="template: {name: 'horizSlider',
              data: { options: _.map(_.range(-450, 451), function(i) { return i / 10; }),
                  suffix: '°',
                  value: rotationAngle,
                  isFloatValue: true,
                  noSnapToTicks: true,
                  displayTicks: 2,
                  manualEditing: true,
                  manualEditingPostfix: '°'} }">
          </div>
        </div>
    </div>
</script>

<script type="text/html" id="toggleSliderDesc">
  <a href="javascript:void(0)" class="tooltip"  data-bind="localizedTitle: tooltipText, tooltip: {}"></a>
  <div class="container" >
    <div class="toggleContainer">
      <div class="modeToggle">
        <div class="toggleButton" data-bind="toggle: {field: toggleField, numerical: numerical}">
          <label class="labelButton" data-bind="css: {on: toggleField}"></label>
          <label class="before" data-bind="localizedText: 'common.on'"></label>
          <label class="after" data-bind="localizedText: 'common.off'"></label>
        </div>
      </div>
      <label class="toggleLabel" data-bind="localizedText: toggleLabelText"></label>
    </div>

    <label class="toggleTooltip" data-bind="localizedText: toggleDescription"></label>

    <div class="sliderControl">
      <div class="sliderWidget" data-bind="template: {name: 'horizSlider', data: {value: value, options: options, displayOptions: (typeof displayOptions !== 'undefined' && displayOptions) || options , suffix: suffix}}"></div>
      <label class="valSuffix" data-bind="text: (typeof valSuffix !== 'undefined' && ko.unwrap(valSuffix())) || (value() + suffix)"></label>
    </div>
  </div>
</script>
<script type="text/html" id="highEfficiency">
  <div class="highEfficiency">
    <div class="title" data-bind="localizedText: 'widgets.powerManagement.title'"></div>
    <a href="javascript:void(0)" class="tooltip" data-bind="localizedTitle: 'widgets.highEfficiencyMode.tooltip', tooltip: {}"></a>

    <div class="content" data-bind="with: $data.model">
      <!-- LOW POWER GAMING. HIGH EFFICIENCY MODE TOGGLE -->
      <div class="control" data-bind="with: highEfficiencyMode">
        <div class="toggleContainer">
          <div class="modeToggle">
            <div class="toggleButton smallToggleButton" data-bind="toggle: {field: field, numerical: numerical}">
              <label class="labelButton" data-bind="css: {on: field}"></label>
              <label class="before" data-bind="localizedText: 'common.on'"></label>
              <label class="after" data-bind="localizedText: 'common.off'"></label>
            </div>
          </div>
          <label class="toggleLabel" data-bind="localizedText: 'widgets.highEfficiencyMode.title'"></label>
        </div>
        <label class="highEfficiencyDescription" data-bind="localizedText: 'widgets.highEfficiencyMode.description'"></label>
      </div>
      <!-- dropdownContainer -->
      <div class="dropdownContainer effectDropdown" data-bind="dropdown: pollingRate, css:{disabled: !highEfficiencyMode.field()}">
        <a href="javascript:void(0)" class="deviceConfigBtn dropdownButton withArrow" data-bind="text: pollingRate"></a>
        <div class="dropdownContent effectDropdown" >
          <div class="scrollableArea">
            <ul class="" data-bind="foreach: pollingOptions">
              <li class="" data-bind="text:name"></li>
            </ul>
          </div>
        </div>
      </div>
      <div class="control" data-bind="with: autoHighEfficiencyTrigger">
        <div class="toggleContainer">
          <div class="modeToggle">
            <div class="toggleButton smallToggleButton" data-bind="toggle: {field: field, numerical: numerical}">
              <label class="labelButton" data-bind="css: {on: field}"></label>
              <label class="before" data-bind="localizedText: 'common.on'"></label>
              <label class="after" data-bind="localizedText: 'common.off'"></label>
            </div>
          </div>
          <label class="toggleLabel" data-bind="localizedText: 'widgets.autoTriggerHighEfficiencyMode.title'"></label>
        </div>
        <label class="highEfficiencyDescription" data-bind="localizedText: 'widgets.autoTriggerHighEfficiencyMode.description'"></label>
      </div>
      <div class="batteryPercentControl" data-bind="with: autoHighEfficiencyBatt">
        <div class="sliderWidget-percentage" data-bind="template: {name: 'horizSlider', data: {value: value, options: options, suffix: '%'}}"></div>
        <label class="batteryPercent" data-bind="text: `${valuePercent()}%`"></label>
      </div>
  </div>
</script>
