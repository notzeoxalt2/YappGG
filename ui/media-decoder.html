<!doctype html><meta charset="utf-8"><title>YappGG media decoder</title>
<script>
window.decodeSound=async encoded=>{
 const raw=atob(encoded),bytes=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);
 const audio=new AudioContext();try{
 const decoded=await audio.decodeAudioData(bytes.buffer);if(decoded.duration>600)throw Error('This codec supports sounds up to 10 minutes long.');
 const context=new OfflineAudioContext(1,Math.ceil(decoded.duration*48000),48000),source=context.createBufferSource();source.buffer=decoded;source.connect(context.destination);source.start();const rendered=await context.startRendering(),samples=rendered.getChannelData(0);
 const wav=new ArrayBuffer(44+samples.length*4),view=new DataView(wav),tag=(at,text)=>{for(let i=0;i<text.length;i++)view.setUint8(at+i,text.charCodeAt(i));};tag(0,'RIFF');view.setUint32(4,wav.byteLength-8,true);tag(8,'WAVE');tag(12,'fmt ');view.setUint32(16,16,true);view.setUint16(20,3,true);view.setUint16(22,1,true);view.setUint32(24,48000,true);view.setUint32(28,192000,true);view.setUint16(32,4,true);view.setUint16(34,32,true);tag(36,'data');view.setUint32(40,samples.length*4,true);for(let i=0;i<samples.length;i++)view.setFloat32(44+i*4,samples[i],true);
 const data=new Uint8Array(wav),parts=[];for(let i=0;i<data.length;i+=32768)parts.push(String.fromCharCode(...data.subarray(i,i+32768)));
 return {wav:btoa(parts.join('')),durationSeconds:rendered.duration,sampleRate:48000};
 }finally{await audio.close();}
};
</script>
