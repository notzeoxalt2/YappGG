<!--static templates-->
<div class="settings settingsHasFixed scrollableContainer horizontal vertical">

    <div class="cols" data-bind="with: device">

        <div class="col col1 fixedSection">

          <!-- TRIGGER MAPPING WIDGET -->
          <div data-bind="template: {name: 'mappings', data: { bindings: selectedConfig().bindings(), selectBinding: selectedConfig().actionsModel.selectBinding, quicksetDialog: selectedConfig().actionsModel.dialog, orientationModel: orientationModel, openMacroEditor: selectedConfig().actionsModel.dialog.openMacroEditor } }">
          </div>

          <!-- DEVICE IMAGE TOGGLES -->
          <div id="DeviceOrientationToggle" class="btnList btnListStack" data-bind="with: orientationModel">
            <div class="viewToggles">
              <button class="box boxHighlight" data-bind="localizedText: 'deviceConfig.deviceViewLeft', css: {active: view() == 'lateralView'}, click: setLateralView"></button><button class="box boxHighlight" data-bind="localizedText: 'deviceConfig.deviceViewTop', css: {active: view() == 'dorsalView'}, click: setDorsalView"></button>
            </div>
          </div>

        </div><!-- .col1 -->

        <div class="col col2 fixedSection">

          <!-- DEVICE IMAGE -->
          <section>
            <div class="deviceImg">
              <div class="deviceImgContainer" data-bind="css: orientationModel.view()"></div>
            </div>
          </section>

        </div><!-- .col2 -->
    </div><!-- .fixedSection -->

    <div class="scrollingSection">
      <div class="widgetsContainer widgetsContainerStatic">

        <div class="widgetsColumn" data-bind="with: device.selectedConfig()">

          <div class="ledToggle" data-bind="with: settings()">
            <div data-bind="template: {name: 'ledToggle', data: {toggleField: led_on_off.wheel, localizationKey: 'widgets.ledToggle.wheel'}}"></div>
          </div>

          <section id="Resolution1" class="widget">
            <div data-bind="template: {name: 'cpi', data: {cpiModel : cpiLevel1}}"></div>
          </section>

          <section id="Resolution2" class="widget">
            <div data-bind="template: {name: 'cpi', data: {cpiModel : cpiLevel2}}"></div>
          </section>

        </div>

        <div class="widgetsColumn" data-bind="with: device.selectedConfig()">

          <div class="ledToggle" data-bind="with: settings()">
            <div data-bind="template: {name: 'ledToggle', data: {toggleField: led_on_off.logo, localizationKey: 'widgets.ledToggle.logo'}}"></div>
          </div>

          <section id="Resolution3" class="widget">
            <div data-bind="template: {name: 'cpi', data: {cpiModel : cpiLevel3}}"></div>
          </section>

          <section id="Resolution4" class="widget">
            <div data-bind="template: {name: 'cpi', data: {cpiModel : cpiLevel4}}"></div>
          </section>

          <div class="widgetsColumn" data-bind="with: settings()">

            <section id="PollingRate" class="widget">
              <div data-bind="template: {name: 'pollingRate', data: { pollingRateRange: [8, 2, 0], pollingRateLevel: polling_and_resolution_levels.polling_rate, pollingRateHz: polling_and_resolution_levels.hz } }"></div>
            </section>

          </div>

        </div>


        
      </div>
    </div><!-- .scrollingSection -->

</div> <!-- device -->
