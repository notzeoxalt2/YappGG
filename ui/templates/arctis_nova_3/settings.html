<div class="settings settingsHasFixed scrollableContainer horizontal vertical" data-bind="with: device.selectedConfig()"> 
    <!-- DEVICE SECTION -->
  <section class="deviceSection">
    <!-- ko if: settingsTabsProps.selectedTabIdKO() === settingsTabsProps.isAudioMode -->
    <div class="renderedDeviceImg"></div>
    <!-- /ko -->
    <!-- ko if: settingsTabsProps.selectedTabIdKO() === settingsTabsProps.isIllumMode -->
    <div class="svgDeviceImg" data-bind="svgDeviceImg: { deviceId: $root.device.id, deviceName: $root.device.name, zones: svgDeviceImgZones(), useZoneSelection: true, onZoneSelect: onZoneSelect }"></div>    
    <!-- /ko -->
  </section>
  <section class="scrollingSection">
    <div class="settingsTabs" data-bind="template: { name: 'settingsTabs', data: settingsTabsProps }"></div>
    <div class="audioTabContents" data-bind="if: settingsTabsProps.selectedTabIdKO() === settingsTabsProps.isAudioMode">
      <div class="widgetsContainer">
        <div class="grid-widget-container widgetsContainerStatic">
          <!-- EQ widget -->
          <section class="full-width opaque widget" style="width: auto;">
            <div class="title" data-bind="localizedText: 'widgets.equalizer.title'"></div>
            <a href="javascript:void(0)" class="tooltip" data-bind="localizedTitle: 'widgets.tooltip.equalizer', tooltip: {}"></a>
            <div class="eq" data-bind="template: { name: 'eq', data: eqProps }"></div>
          </section>

          <!-- Microphone volume widget -->
          <section class="opaque widget" style="width: auto;">
            <div class="title" data-bind="localizedText: 'widgets.micVolume'"></div>
            <a href="javascript:void(0)" class="tooltip" data-bind="localizedTitle: 'widgets.tooltip.micVolume', tooltip: {}"></a>
            <div class="micVolume" data-bind="template: {name: 'microphoneVolume', data: microphoneVolumeProps }"></div>
          </section>

          <!-- Sidetone widget -->
          <section class="opaque widget" style="width: auto;">
            <div class="title" data-bind="localizedText: 'widgets.sideTone'"></div>
            <a href="javascript:void(0)" class="tooltip" data-bind="localizedTitle: 'widgets.tooltip.sidetone', tooltip: {}"></a>
            <div class="sidetoneSlider" data-bind="template: { name: 'sidetoneSliderReact', data: sidetoneProps }"></div>
          </section>

          <!-- Mic preview widget -->
          <section class="opaque widget" style="width: auto;">
            <div class="title" data-bind="localizedText: 'widgets.micPreview.title'"></div>
            <a href="javascript:void(0)" class="tooltip" data-bind="localizedTitle: 'widgets.micPreview.tooltip', tooltip: {}"></a>
            <div class="micPreview" data-bind="template: { name: 'micPreviewReact', data: micPreviewProps }"></div>
          </section>

          <!-- Mic brightness widget -->
          <section class="opaque widget" style="width: auto;">
            <div class="title" data-bind="localizedText: 'widgets.micMutedLEDBrightness.title'"></div>
            <a href="javascript:void(0)" class="tooltip" data-bind="localizedTitle: 'widgets.micMutedLEDBrightness.tooltip', tooltip: {}"></a>
            <div class="micBrightness" data-bind="template: { name: 'micBrightness', data: micBrightnessProps }"></div>
          </section>
        </div>
      </div>
    </div>
    <div class="settingsTabContents" data-bind="if: settingsTabsProps.selectedTabIdKO() === settingsTabsProps.isIllumMode">
      <div class="widgetsContainer">
        <div class="grid-widget-container widgetsContainerStatic">
          <section class="full-width opaque widget" style="width: auto;">
            <div class="lightingPalette" data-bind="template: { name: 'lightingPalette', data: { ...lightingPaletteProps, disabledKO: $root.device.isPrismEnabledForDevice } }"></div>
          </section>
        </div>
      </div>
    </div>
  </section>
</div><!-- device -->
